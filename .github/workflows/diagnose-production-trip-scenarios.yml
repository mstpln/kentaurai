name: Diagnose production trip scenarios

on:
  push:
    branches:
      - diagnose-trip-scenarios-prod

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read aggregate production status
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT

          query() {
            local sql="$1"
            local code
            code="$(curl --silent --show-error --output "$out" --write-out '%{http_code}'               --request POST               --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               --header 'Content-Type: application/json'               --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"               "$api")"
            [[ "$code" == "200" ]]
            jq -e '.success == true and (.result | length >= 1) and (.result | all(.success == true))' "$out" >/dev/null
            jq -c '.result[0].results' "$out"
          }

          echo "=== TRIP_JOB ==="
          query "SELECT status,start_date,end_date,processed_sources,inserted_rows,skipped_rows,consecutive_errors,last_run_at,(last_error IS NOT NULL) AS has_error FROM xlabs_position_reconstruction_jobs WHERE id='xposjob_xlabs-trip-classification-v1__existing' LIMIT 1;"

          echo "=== SOURCE_INVENTORY ==="
          query "SELECT COUNT(*) AS stored_sources,MIN(SUBSTR(external_id,1,10)) AS min_date,MAX(SUBSTR(external_id,1,10)) AS max_date FROM source_records WHERE source_type='xlabs_race_json' AND raw_object_key IS NOT NULL;"

          echo "=== JOB_RANGE_INVENTORY ==="
          query "WITH j AS (SELECT start_date,end_date FROM xlabs_position_reconstruction_jobs WHERE id='xposjob_xlabs-trip-classification-v1__existing' LIMIT 1) SELECT COUNT(*) AS job_sources FROM source_records,j WHERE source_type='xlabs_race_json' AND raw_object_key IS NOT NULL AND SUBSTR(external_id,1,10) BETWEEN j.start_date AND j.end_date;"

          echo "=== JOB_QUARANTINE ==="
          query "SELECT COUNT(*) AS quarantined_sources FROM xlabs_position_reconstruction_quarantine WHERE job_id='xposjob_xlabs-trip-classification-v1__existing';"

          echo "=== CLASSIFICATION_TOTALS ==="
          query "SELECT COUNT(*) AS rows,COUNT(DISTINCT race_entry_id) AS entries,COUNT(DISTINCT source_record_id) AS source_records FROM race_positions WHERE classification_version='xlabs-trip-classification-v1';"

          echo "=== CLASSIFICATION_BY_SCENARIO ==="
          query "SELECT CASE WHEN leader=1 THEN 'leader' WHEN pocket=1 THEN 'pocket' WHEN death_seat=1 THEN 'death_seat' WHEN second_over=1 THEN 'second_over' WHEN third_over=1 THEN 'third_over' WHEN json_extract(event_json,'$.scenario_key')='back' THEN 'back' ELSE 'unknown' END AS scenario,COUNT(*) AS rows FROM race_positions WHERE classification_version='xlabs-trip-classification-v1' GROUP BY scenario ORDER BY scenario;"

          echo "=== UI_ELIGIBLE_BY_YEAR ==="
          query "SELECT SUBSTR(r.race_date,1,4) AS year,COUNT(*) AS rows,COUNT(DISTINCT re.horse_id) AS horses,COUNT(DISTINCT r.id) AS races FROM race_positions rp JOIN race_entries re ON re.id=rp.race_entry_id JOIN races r ON r.id=re.race_id JOIN race_results rr ON rr.race_entry_id=re.id WHERE rp.classification_version='xlabs-trip-classification-v1' AND re.horse_id IS NOT NULL AND re.scratched=0 GROUP BY SUBSTR(r.race_date,1,4) ORDER BY year DESC;"

          echo "=== NORMALIZE_RUNS ==="
          query "SELECT status,COUNT(*) AS runs FROM import_runs WHERE source_type='xlabs_position_reconstruction_v1_normalize' GROUP BY status ORDER BY status;"

          echo "=== UI_DEFAULT_SCOPE_COVERAGE ==="
          query "SELECT
            COUNT(*) AS scenario_rows,
            COUNT(DISTINCT re.horse_id) AS horses,
            COUNT(DISTINCT r.id) AS races
          FROM race_positions rp
          JOIN race_entries re ON re.id=rp.race_entry_id
          JOIN races r ON r.id=re.race_id
          JOIN race_results rr ON rr.race_entry_id=re.id
          WHERE rp.classification_version='xlabs-trip-classification-v1'
            AND re.horse_id IS NOT NULL
            AND re.scratched=0
            AND SUBSTR(r.race_date,1,4)='2026'
            AND (
              r.first_prize_sek >= 100000
              OR EXISTS (SELECT 1 FROM race_scope_evidence rse WHERE rse.race_id=r.id)
              OR UPPER(COALESCE(r.race_name,'') || ' ' || COALESCE(r.main_class,'')) LIKE '%STL%'
              OR UPPER(COALESCE(r.race_name,'') || ' ' || COALESCE(r.main_class,'')) LIKE '%SVENSKA TRAVLIG%'
            );"

          echo "=== JOB_FAILURE_CLASS ==="
          query "SELECT
            CASE
              WHEN last_error IS NULL THEN 'none'
              WHEN LOWER(last_error) LIKE '%raw object%' OR LOWER(last_error) LIKE '%r2%' THEN 'raw_storage'
              WHEN LOWER(last_error) LIKE '%json%' OR LOWER(last_error) LIKE '%payload%' THEN 'payload_validation'
              WHEN LOWER(last_error) LIKE '%track%' OR LOWER(last_error) LIKE '%race%' OR LOWER(last_error) LIKE '%entry%' THEN 'race_mapping'
              WHEN LOWER(last_error) LIKE '%timestamp%' OR LOWER(last_error) LIKE '%distance%' OR LOWER(last_error) LIKE '%frame%' OR LOWER(last_error) LIKE '%target%' THEN 'telemetry_reconstruction'
              WHEN LOWER(last_error) LIKE '%constraint%' OR LOWER(last_error) LIKE '%unique%' OR LOWER(last_error) LIKE '%foreign key%' THEN 'database_constraint'
              ELSE 'other'
            END AS failure_class,
            LENGTH(COALESCE(last_error,'')) AS error_length
          FROM xlabs_position_reconstruction_jobs
          WHERE id='xposjob_xlabs-trip-classification-v1__existing'
          LIMIT 1;"

          echo "=== JOB_FAILURE_DETAIL ==="
          query "SELECT
            CASE
              WHEN last_error IS NULL THEN 'none'
              WHEN INSTR(last_error,'timestamps must be strictly increasing') > 0 THEN 'timestamps_not_strictly_increasing'
              WHEN INSTR(last_error,'contains no active official starters') > 0 THEN 'no_active_official_starters'
              WHEN INSTR(last_error,'normalized official race entries are required') > 0 THEN 'missing_official_entries'
              WHEN INSTR(last_error,'normalized official race has no active entries') > 0 THEN 'no_active_official_entries'
              WHEN INSTR(last_error,'duplicate target') > 0 THEN 'duplicate_target'
              WHEN INSTR(last_error,'target number') > 0 THEN 'invalid_target_number'
              WHEN INSTR(last_error,'posX must be finite') > 0 THEN 'invalid_pos_x'
              WHEN INSTR(last_error,'posY must be finite') > 0 THEN 'invalid_pos_y'
              WHEN INSTR(last_error,'distanceToFinish must be finite') > 0 THEN 'invalid_distance_to_finish'
              WHEN INSTR(last_error,'unexpected trackId') > 0 THEN 'unexpected_track_id'
              WHEN INSTR(last_error,'unexpected raceNumber') > 0 THEN 'unexpected_race_number'
              WHEN INSTR(last_error,'targets must be an array') > 0 THEN 'targets_not_array'
              WHEN INSTR(last_error,'invalid timestamp') > 0 THEN 'invalid_timestamp'
              ELSE 'other'
            END AS failure_detail
          FROM xlabs_position_reconstruction_jobs
          WHERE id='xposjob_xlabs-trip-classification-v1__existing'
          LIMIT 1;"

          echo "=== ANALYSIS_COVERAGE_BY_METHOD_DISTANCE ==="
          query "WITH x AS (
            SELECT
              CASE WHEN LOWER(COALESCE(r.start_method,'')) LIKE '%auto%' THEN 'auto'
                   WHEN LOWER(COALESCE(r.start_method,'')) LIKE '%volt%' THEN 'volt'
                   ELSE 'other' END AS method,
              CASE WHEN r.distance_m BETWEEN 1540 AND 1740 THEN '1640'
                   WHEN r.distance_m BETWEEN 2040 AND 2240 THEN '2140'
                   WHEN r.distance_m BETWEEN 2540 AND 2740 THEN '2640'
                   WHEN r.distance_m BETWEEN 3040 AND 3240 THEN '3140'
                   ELSE 'other' END AS distance_group,
              r.id AS race_id,
              rp.id AS position_id
            FROM race_positions rp
            JOIN race_entries re ON re.id=rp.race_entry_id
            JOIN races r ON r.id=re.race_id
            JOIN race_results rr ON rr.race_entry_id=re.id
            WHERE rp.classification_version='xlabs-trip-classification-v1'
              AND re.scratched=0
          )
          SELECT method,distance_group,COUNT(DISTINCT race_id) AS races,COUNT(*) AS scenario_rows
          FROM x GROUP BY method,distance_group ORDER BY method,distance_group;"

          echo "=== EXACT_COMBINATION_SAMPLE_BINS ==="
          query "WITH combo AS (
            SELECT r.track_id,
              CASE WHEN LOWER(COALESCE(r.start_method,'')) LIKE '%auto%' THEN 'auto'
                   WHEN LOWER(COALESCE(r.start_method,'')) LIKE '%volt%' THEN 'volt'
                   ELSE 'other' END AS method,
              CASE WHEN r.distance_m BETWEEN 1540 AND 1740 THEN '1640'
                   WHEN r.distance_m BETWEEN 2040 AND 2240 THEN '2140'
                   WHEN r.distance_m BETWEEN 2540 AND 2740 THEN '2640'
                   WHEN r.distance_m BETWEEN 3040 AND 3240 THEN '3140'
                   ELSE 'other' END AS distance_group,
              COUNT(DISTINCT r.id) AS races
            FROM race_positions rp
            JOIN race_entries re ON re.id=rp.race_entry_id
            JOIN races r ON r.id=re.race_id
            JOIN race_results rr ON rr.race_entry_id=re.id
            WHERE rp.classification_version='xlabs-trip-classification-v1'
              AND re.scratched=0
            GROUP BY r.track_id,method,distance_group
          )
          SELECT CASE WHEN races<10 THEN 'lt10' WHEN races<25 THEN '10_24' WHEN races<50 THEN '25_49' WHEN races<100 THEN '50_99' ELSE '100_plus' END AS sample_bin,
                 COUNT(*) AS combinations
          FROM combo GROUP BY sample_bin ORDER BY CASE sample_bin WHEN 'lt10' THEN 1 WHEN '10_24' THEN 2 WHEN '25_49' THEN 3 WHEN '50_99' THEN 4 ELSE 5 END;"

          echo "=== FORWARD_LANE_COVERAGE ==="
          query "SELECT
            CASE WHEN LOWER(COALESCE(r.start_method,'')) LIKE '%auto%' THEN 'auto'
                 WHEN LOWER(COALESCE(r.start_method,'')) LIKE '%volt%' THEN 'volt'
                 ELSE 'other' END AS method,
            re.start_position AS lane,
            COUNT(*) AS starts,
            SUM(CASE WHEN rr.placing=1 THEN 1 ELSE 0 END) AS wins,
            SUM(CASE WHEN rr.placing BETWEEN 1 AND 3 THEN 1 ELSE 0 END) AS top3
          FROM race_positions rp
          JOIN race_entries re ON re.id=rp.race_entry_id
          JOIN races r ON r.id=re.race_id
          JOIN race_results rr ON rr.race_entry_id=re.id
          WHERE rp.classification_version='xlabs-trip-classification-v1'
            AND re.scratched=0
            AND re.start_position BETWEEN 1 AND 8
          GROUP BY method,re.start_position ORDER BY method,re.start_position;"

          echo "=== WINNER_SCENARIO_DISTRIBUTION ==="
          query "SELECT
            CASE WHEN rp.leader=1 THEN 'leader'
                 WHEN rp.pocket=1 THEN 'pocket'
                 WHEN rp.death_seat=1 THEN 'death_seat'
                 WHEN rp.second_over=1 THEN 'second_over'
                 WHEN rp.third_over=1 THEN 'third_over'
                 WHEN json_extract(rp.event_json,'$.scenario_key')='back' THEN 'back'
                 ELSE 'unknown' END AS scenario,
            COUNT(*) AS winner_rows
          FROM race_positions rp
          JOIN race_entries re ON re.id=rp.race_entry_id
          JOIN race_results rr ON rr.race_entry_id=re.id
          WHERE rp.classification_version='xlabs-trip-classification-v1'
            AND re.scratched=0
            AND rr.placing=1
          GROUP BY scenario ORDER BY winner_rows DESC;"

          echo "=== UI_TRIP_QUERY_PROBE ==="
          query "WITH target AS (
            SELECT re.horse_id
            FROM race_positions rp
            JOIN race_entries re ON re.id=rp.race_entry_id
            JOIN races r ON r.id=re.race_id
            JOIN race_results rr ON rr.race_entry_id=re.id
            WHERE rp.classification_version='xlabs-trip-classification-v1'
              AND re.horse_id IS NOT NULL
              AND re.scratched=0
              AND r.race_date>='2026-01-01'
              AND r.race_date<='2026-09-23'
              AND (
                r.first_prize_sek>=100000
                OR EXISTS (SELECT 1 FROM race_scope_evidence rse_scope WHERE rse_scope.race_id=r.id)
                OR UPPER(COALESCE(r.race_name,'') || ' ' || COALESCE(r.main_class,'') || ' ' || COALESCE(r.class_flags_json,'')) LIKE '% STL %'
              )
            GROUP BY re.horse_id
            ORDER BY COUNT(*) DESC
            LIMIT 1
          ), latest_trip AS (
            SELECT rp.*,
              ROW_NUMBER() OVER (
                PARTITION BY rp.race_entry_id
                ORDER BY julianday(sr.fetched_at) DESC,rp.id DESC
              ) rn
            FROM race_positions rp
            JOIN source_records sr ON sr.id=rp.source_record_id
            WHERE rp.classification_version='xlabs-trip-classification-v1'
          ), filtered AS MATERIALIZED (
            SELECT re.id race_entry_id,rr.placing,
              CASE
                WHEN rp.leader=1 THEN 'leader'
                WHEN rp.pocket=1 THEN 'pocket'
                WHEN rp.death_seat=1 THEN 'death_seat'
                WHEN rp.second_over=1 THEN 'second_over'
                WHEN rp.third_over=1 THEN 'third_over'
                WHEN json_extract(rp.event_json,'$.scenario_key')='back' THEN 'back'
                ELSE NULL
              END scenario
            FROM race_entries re INDEXED BY idx_entries_horse_race
            JOIN races r ON r.id=re.race_id
            JOIN race_results rr ON rr.race_entry_id=re.id
            JOIN horses h ON h.id=re.horse_id
            JOIN latest_trip rp ON rp.race_entry_id=re.id AND rp.rn=1
            WHERE re.scratched=0
              AND re.horse_id=(SELECT horse_id FROM target)
              AND r.race_date>='2026-01-01'
              AND r.race_date<='2026-09-23'
              AND (
                r.first_prize_sek>=100000
                OR EXISTS (SELECT 1 FROM race_scope_evidence rse_scope WHERE rse_scope.race_id=r.id)
                OR UPPER(COALESCE(r.race_name,'') || ' ' || COALESCE(r.main_class,'') || ' ' || COALESCE(r.class_flags_json,'')) LIKE '% STL %'
              )
          ), grouped AS (
            SELECT scenario,COUNT(*) starts
            FROM filtered
            WHERE scenario IS NOT NULL
            GROUP BY scenario
          )
          SELECT COUNT(*) AS scenario_groups,COALESCE(SUM(starts),0) AS starts FROM grouped;"
