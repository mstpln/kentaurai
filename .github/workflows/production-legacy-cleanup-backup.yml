name: Private D1 backup for legacy cleanup (backup ONLY)
run-name: Legacy cleanup private backup — no deletion

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type BACKUP_D1_ONLY. Large D1 exports can pause queries; 5 GiB single-upload limit."
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  private_backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    concurrency:
      group: kentaurai-production-operation
      cancel-in-progress: false
    env:
      WORKER_NAME: kentaurai-api
    steps:
      - name: Checkout exact reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require typed backup-only approval and exact release
        env:
          APPROVAL: ${{ inputs.approval }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$APPROVAL" = BACKUP_D1_ONLY
          releases="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-release-v060.yml/runs?branch=main&status=success&per_page=1")"
          test "$(printf '%s' "$releases" | jq -r '.workflow_runs[0].head_sha // empty')" = "$GITHUB_SHA"

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Run complete QA before Cloudflare access
        run: npm run qa

      - name: Verify private Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Install ephemeral backup-only credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        id: backup_credential
        shell: bash
        run: |
          set -euo pipefail
          token="$(node -e "console.log(Date.now()+'.'+require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$token" | npx --yes wrangler@4.114.0 secret put LEGACY_BACKUP_TOKEN --name "$WORKER_NAME"
          printf '%s\n' "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler@4.114.0 secret put HISTORICAL_BACKUP_API_TOKEN --name "$WORKER_NAME"
          printf '%s\n' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4.114.0 secret put HISTORICAL_RECOVERY_ACCOUNT_ID --name "$WORKER_NAME"
          printf 'true\n' | npx --yes wrangler@4.114.0 secret put LEGACY_BACKUP_ENABLED --name "$WORKER_NAME"

      - name: Resolve exact production Worker route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          subdomain="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/subdomain" | jq -r '.result.subdomain // empty')"
          test -n "$subdomain"
          enabled="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts/$WORKER_NAME/subdomain" | jq -r '.result.enabled // false')"
          test "$enabled" = true
          url="https://$WORKER_NAME.$subdomain.workers.dev"
          curl --fail --silent --show-error "$url/health" > "$RUNNER_TEMP/legacy-health.json"
          jq -e --arg sha "$GITHUB_SHA" '.ok == true and .deploymentSha == $sha' \
            "$RUNNER_TEMP/legacy-health.json" > /dev/null
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify backup-only private authorization
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
          CLEANUP_TOKEN: ${{ steps.backup_credential.outputs.token }}
        run: |
          set -euo pipefail
          confirmed=0
          for attempt in $(seq 1 25); do
            status="$(curl --silent --output "$RUNNER_TEMP/legacy-auth.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLEANUP_TOKEN" \
              "$WORKER_URL/v1/storage-cleanup/legacy-backup/auth-check" || true)"
            if [ "$status" = 200 ] && jq -e '.ok == true and .scope == "legacy_backup_only"' \
                 "$RUNNER_TEMP/legacy-auth.json" >/dev/null 2>&1; then
              confirmed=$((confirmed+1))
              if [ "$confirmed" -ge 2 ]; then exit 0; fi
            else
              confirmed=0
            fi
            sleep 2
          done
          echo "::error::Private backup route did not authorize; export never started."
          exit 1

      - name: Create and verify private Cloudflare D1 to R2 backup
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
          CLEANUP_TOKEN: ${{ steps.backup_credential.outputs.token }}
        run: node scripts/run-production-legacy-cleanup-backup.mjs

      - name: Remove every ephemeral backup credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ always() && steps.backup_credential.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(npx --yes wrangler@4.114.0 secret list --name "$WORKER_NAME" --format json)"
          for name in LEGACY_BACKUP_ENABLED HISTORICAL_BACKUP_API_TOKEN \
            HISTORICAL_RECOVERY_ACCOUNT_ID LEGACY_BACKUP_TOKEN; do
            if printf '%s' "$names" | jq -e --arg name "$name" \
              '.[] | select(.name == $name)' > /dev/null; then
              printf 'y\n' | npx --yes wrangler@4.114.0 secret delete "$name" --name "$WORKER_NAME"
            fi
          done

      - name: Verify production health after secret cleanup
        if: ${{ always() && steps.worker.outcome == 'success' }}
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" > "$RUNNER_TEMP/legacy-health-after.json"
          jq -e --arg sha "$GITHUB_SHA" '.ok == true and .deploymentSha == $sha' \
            "$RUNNER_TEMP/legacy-health-after.json" > /dev/null

      - name: Record non-destructive boundary
        if: ${{ always() }}
        run: |
          echo "Backup-only operation. No SQL dump, source records, R2 keys or API tokens exposed to GitHub." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow has no deletion or restore route. Do not run cleanup based only on backup success." >> "$GITHUB_STEP_SUMMARY"
