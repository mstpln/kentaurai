name: Production storage cleanup
run-name: Production storage cleanup (${{ inputs.mode }}) — @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run only, or execute reviewed cleanup until complete
        required: true
        type: choice
        options:
          - dry-run
          - execute
        default: dry-run
      confirmation:
        description: 'Execute: type EXACTLY EXECUTE REVIEWED STORAGE CLEANUP; dry-run: leave blank.'
        required: false
        type: string
      dry_run_max_batches:
        description: Maximum bounded batches per cleanup family for dry-run only
        required: true
        type: choice
        options:
          - "25"
          - "50"
          - "100"
          - "250"
        default: "50"
      continuation_audit:
        description: "DRY-RUN: leave blank to start or resume; optional previous Audit-ID."
        required: false
        type: string
      continuation_session:
        description: "EXECUTE ONLY: internal cleanup session. Always blank for dry-run."
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: kentaurai-production-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ inputs.mode == 'dry-run' || (inputs.mode == 'execute' && inputs.confirmation == 'EXECUTE REVIEWED STORAGE CLEANUP') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MODE: ${{ inputs.mode }}
      DRY_RUN_MAX_BATCHES: ${{ inputs.dry_run_max_batches }}
      CLEANUP_SOFT_DEADLINE_MS: "2100000"
      CLEANUP_RUN_MAX_ROWS_READ: "1000000"
      CLEANUP_RUN_MAX_ROWS_WRITTEN: "100000"
      CLEANUP_SESSION_ID: ${{ inputs.continuation_session }}
      CLEANUP_AUDIT_RUN_ID: ${{ inputs.continuation_audit }}
      CLEANUP_TRIGGER_CONFIRMATION: ${{ inputs.confirmation }}
      D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
      WORKER_NAME: kentaurai-api

    steps:
      - name: Checkout exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Production cleanup must run from main"; exit 1; }

      - name: Validate cleanup continuation fields before costly work
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = "dry-run" ]; then
            case "$CLEANUP_TRIGGER_CONFIRMATION" in
              ""|"RESUME READ ONLY AUDIT") ;;
              *) echo "::error::Dry-run refuses execute confirmation or unknown marker."; exit 1 ;;
            esac
            if [ "$CLEANUP_TRIGGER_CONFIRMATION" = "RESUME READ ONLY AUDIT" ]; then
              if [ -z "$CLEANUP_AUDIT_RUN_ID" ] || [ -n "$CLEANUP_SESSION_ID" ]; then
                echo "::error::An automatic READ-ONLY continuation needs exactly one audit ID, never a session ID."
                exit 1
              fi
            fi
            if [ -n "$CLEANUP_SESSION_ID" ] && [ -n "$CLEANUP_AUDIT_RUN_ID" ]; then
              echo "::error::Dry-run has two IDs. Fill only continuation_audit and leave continuation_session blank."
              exit 1
            fi
            if [ -n "$CLEANUP_SESSION_ID" ]; then
              echo "::warning::Audit-ID entered under continuation_session: the dry-run runner will safely use it as continuation_audit."
            fi
          fi

      - name: Require exact deployed main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-release-v060.yml/runs?branch=main&status=success&per_page=1")"
          deployed_sha="$(printf '%s' "$response" | jq -r '.workflow_runs[0].head_sha // empty')"
          test -n "$deployed_sha" || { echo "::error::No successful production release was found"; exit 1; }
          test "$deployed_sha" = "$GITHUB_SHA" || {
            echo "::error::Cleanup requires main to match the exact latest successful production release"
            exit 1
          }

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Run QA before production operation
        run: npm run qa

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Create short-lived cleanup-only Worker token
        id: cleanup_token
        shell: bash
        run: |
          set -euo pipefail
          cleanup_token="$(node -e "console.log(Date.now()+'.'+require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$cleanup_token"
          echo "token=$cleanup_token" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$cleanup_token" | npx --yes wrangler@4.114.0 secret put STORAGE_CLEANUP_TOKEN --name "$WORKER_NAME"

      - name: Resolve and verify production Worker URL
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/subdomain" > /tmp/workers-subdomain.json
          jq -e '.success == true and (.result.subdomain | type == "string") and (.result.subdomain | length > 0)' /tmp/workers-subdomain.json >/dev/null
          subdomain="$(jq -r '.result.subdomain' /tmp/workers-subdomain.json)"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts/$WORKER_NAME/subdomain" > /tmp/worker-route.json
          jq -e '.success == true and .result.enabled == true' /tmp/worker-route.json >/dev/null

          worker_url="https://$WORKER_NAME.$subdomain.workers.dev"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$worker_url/health" > /tmp/health.json
          jq -e '.ok == true and .service == "kentaurai-api"' /tmp/health.json >/dev/null
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Wait for cleanup auth to propagate
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
          CLEANUP_TOKEN: ${{ steps.cleanup_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            status="$(curl --silent --output /tmp/cleanup-auth.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLEANUP_TOKEN" \
              "$WORKER_URL/v1/storage-cleanup/auth-check" || true)"
            if [ "$status" = "200" ] && jq -e '.ok == true and .scope == "storage_cleanup"' /tmp/cleanup-auth.json >/dev/null 2>&1; then
              echo "Cleanup auth propagated."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Cleanup auth did not propagate within 30 seconds"
          exit 1

      - name: Capture D1 Time Travel restore point
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          restore_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/time_travel/bookmark"
          curl --fail --silent --show-error --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" > /tmp/d1-bookmark.json
          jq -e '.success == true and (.result.bookmark | type == "string") and (.result.bookmark | length > 0)' /tmp/d1-bookmark.json >/dev/null
          bookmark="$(jq -r '.result.bookmark' /tmp/d1-bookmark.json)"
          echo "::add-mask::$bookmark"
          echo "restore_timestamp=$restore_timestamp" >> "$GITHUB_OUTPUT"
          echo "Verified D1 Time Travel restore point at $restore_timestamp."

      - name: Run cleanup
        id: cleanup
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
          ADMIN_TOKEN: ${{ steps.cleanup_token.outputs.token }}
        run: node scripts/run-production-storage-cleanup.mjs

      - name: Remove short-lived cleanup-only Worker token
        if: ${{ always() && steps.cleanup_token.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@4.114.0 secret list --name "$WORKER_NAME" --format json | jq -e '.[] | select(.name == "STORAGE_CLEANUP_TOKEN")' >/dev/null; then
            printf 'y\n' | npx --yes wrangler@4.114.0 secret delete STORAGE_CLEANUP_TOKEN --name "$WORKER_NAME"
          fi

      - name: Verify production health after cleanup run
        if: ${{ always() && steps.worker.outcome == 'success' }}
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$WORKER_URL/health" > /tmp/health-after.json
          jq -e '.ok == true and .service == "kentaurai-api"' /tmp/health-after.json >/dev/null
          echo "Production health check passed."

      - name: Refuse automatic continuation after cumulative cost stop
        if: ${{ success() && ((env.MODE == 'execute' && steps.cleanup.outputs.cleanup_complete == 'false' && steps.cleanup.outputs.cost_budget_stop == 'true') || (env.MODE == 'dry-run' && steps.cleanup.outputs.audit_incomplete == 'true' && (steps.cleanup.outputs.cost_budget_stop == 'true' || steps.cleanup.outputs.audit_safety_stop == 'true'))) }}
        shell: bash
        run: |
          echo "::error::Cleanup reached the cumulative D1 run-cost budget; automatic continuation is disabled."
          exit 1

      - name: Queue next bounded READ-ONLY audit continuation
        id: queue_audit
        if: ${{ success() && env.MODE == 'dry-run' && steps.cleanup.outputs.audit_incomplete == 'true' && steps.cleanup.outputs.progress_made == 'true' && steps.cleanup.outputs.cost_budget_stop != 'true' && steps.cleanup.outputs.audit_safety_stop != 'true' && steps.cleanup.outputs.cleanup_audit_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_INCOMPLETE: ${{ steps.cleanup.outputs.audit_incomplete }}
          PROGRESS_MADE: ${{ steps.cleanup.outputs.progress_made }}
          COST_BUDGET_STOP: ${{ steps.cleanup.outputs.cost_budget_stop }}
          AUDIT_SAFETY_STOP: ${{ steps.cleanup.outputs.audit_safety_stop }}
          AUDIT_RUN_ID: ${{ steps.cleanup.outputs.cleanup_audit_run_id }}
          AUDIT_CONTINUATION_COUNT: ${{ steps.cleanup.outputs.audit_continuation_count }}
          AUDIT_MAX_CONTINUATIONS: ${{ steps.cleanup.outputs.audit_max_continuations }}
          AUDIT_EXPIRES_AT: ${{ steps.cleanup.outputs.audit_expires_at }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: node scripts/queue-production-storage-audit.mjs

      - name: Require manual intervention for unsafe or stalled integrity audit
        if: ${{ always() && steps.cleanup.outcome == 'success' && steps.cleanup.outputs.audit_incomplete == 'true' && steps.queue_audit.outcome == 'skipped' }}
        shell: bash
        run: |
          echo "::error::The integrity audit is incomplete and no safe continuation was queued. No cleanup mutation ran. Review the cost, progress, and proof status before retrying."
          exit 1

      - name: Refuse stalled execute continuation
        if: ${{ success() && env.MODE == 'execute' && steps.cleanup.outputs.cleanup_complete == 'false' && steps.cleanup.outputs.progress_made != 'true' }}
        shell: bash
        run: |
          echo "::error::Cleanup is incomplete but made no progress; automatic continuation is disabled."
          exit 1

      - name: Queue controlled continuation
        if: ${{ success() && env.MODE == 'execute' && steps.cleanup.outputs.audit_incomplete != 'true' && steps.cleanup.outputs.cleanup_complete == 'false' && steps.cleanup.outputs.progress_made == 'true' && steps.cleanup.outputs.cost_budget_stop != 'true' && steps.cleanup.outputs.cleanup_session_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_SESSION_ID: ${{ steps.cleanup.outputs.cleanup_session_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg session "$CLEANUP_SESSION_ID" '{ref:"main",inputs:{mode:"execute",confirmation:"EXECUTE REVIEWED STORAGE CLEANUP",dry_run_max_batches:"50",continuation_session:$session}}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-storage-cleanup.yml/dispatches" \
            --data "$payload"
          echo "Queued the next source-bound cleanup continuation."

      - name: Cleanup summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "Mode: $MODE"
          echo "Dry-run maximum batches per family: $DRY_RUN_MAX_BATCHES"
          echo "D1 restore point: ${{ steps.restore.outputs.restore_timestamp }}"
          if [ "$MODE" = "dry-run" ]; then
            if [ "${{ steps.cleanup.outputs.audit_incomplete }}" = "true" ]; then
              echo "Integrity audit incomplete; no cleanup planning or mutation was authorized."
              echo "Audit continuation: ${{ steps.cleanup.outputs.audit_continuation_count }}/${{ steps.cleanup.outputs.audit_max_continuations }}"
              if [ "${{ steps.queue_audit.outcome }}" = "success" ]; then
                echo "A new bounded READ-ONLY continuation was automatically queued. You do not need to start another run."
                echo "Read-only audit in progress: next bounded run queued automatically." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "No automatic continuation; review the previous steps before retrying." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "Read-only audit completed and bounded planning reported. No cleanup mutation was authorized." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "${{ steps.cleanup.outputs.cleanup_complete }}" = "true" ]; then
            echo "Cleanup completed snapshot work and raw reference normalization; physical R2 deletion remains deferred."
          elif [ "${{ steps.cleanup.outputs.cost_budget_stop }}" = "true" ]; then
            echo "Cleanup stopped at the cumulative D1 run-cost budget; no automatic continuation was queued."
          elif [ "${{ steps.cleanup.outputs.progress_made }}" = "true" ]; then
            echo "Cleanup checkpointed safely and a controlled continuation was queued."
            echo "Continuation number: ${{ steps.cleanup.outputs.continuation_count }}"
          else
            echo "Cleanup did not complete and no continuation was queued."
          fi
