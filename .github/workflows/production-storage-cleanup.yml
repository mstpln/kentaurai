name: Production storage cleanup
run-name: Production storage cleanup (${{ inputs.mode }}) — ${{ inputs.continuation_request != '' && format('continuation from {0}', inputs.continuation_request) || format('@{0}', github.actor) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only integrity audit and bounded planning; deletion is DISABLED
        required: true
        type: choice
        options:
          - dry-run
        default: dry-run
      confirmation:
        description: "INTERNAL: leave blank; automated READ-ONLY continuations use a fixed marker."
        required: false
        type: string
      dry_run_max_batches:
        description: Maximum bounded batches per cleanup family for dry-run only
        required: true
        type: choice
        options:
          - "25"
          - "50"
          - "100"
          - "250"
        default: "50"
      continuation_audit:
        description: "DRY-RUN: leave blank to start or resume; optional previous Audit-ID."
        required: false
        type: string
      continuation_session:
        description: "UNUSED: always leave blank (destructive execution disabled)."
        required: false
        type: string
      continuation_request:
        description: "INTERNAL: previous GitHub run number/id; leave blank when clicking Run workflow."
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    if: ${{ inputs.mode == 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: kentaurai-production-operation
      cancel-in-progress: false
    outputs:
      audit_incomplete: ${{ steps.cleanup.outputs.audit_incomplete }}
      progress_made: ${{ steps.cleanup.outputs.progress_made }}
      cost_budget_stop: ${{ steps.cleanup.outputs.cost_budget_stop }}
      audit_safety_stop: ${{ steps.cleanup.outputs.audit_safety_stop }}
      audit_run_id: ${{ steps.cleanup.outputs.cleanup_audit_run_id }}
      audit_continuation_count: ${{ steps.cleanup.outputs.audit_continuation_count }}
      audit_max_continuations: ${{ steps.cleanup.outputs.audit_max_continuations }}
      audit_expires_at: ${{ steps.cleanup.outputs.audit_expires_at }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MODE: "dry-run"
      DRY_RUN_MAX_BATCHES: ${{ inputs.dry_run_max_batches }}
      CLEANUP_SOFT_DEADLINE_MS: "2100000"
      CLEANUP_RUN_MAX_ROWS_READ: "1000000"
      CLEANUP_RUN_MAX_ROWS_WRITTEN: "100000"
      CLEANUP_SESSION_ID: ${{ inputs.continuation_session }}
      CLEANUP_AUDIT_RUN_ID: ${{ inputs.continuation_audit }}
      CLEANUP_TRIGGER_CONFIRMATION: ${{ inputs.confirmation }}
      D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
      WORKER_NAME: kentaurai-api

    steps:
      - name: Checkout exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Production cleanup must run from main"; exit 1; }

      - name: Validate cleanup continuation fields before costly work
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = "dry-run" ]; then
            case "$CLEANUP_TRIGGER_CONFIRMATION" in
              ""|"RESUME READ ONLY AUDIT") ;;
              *) echo "::error::Dry-run refuses execute confirmation or unknown marker."; exit 1 ;;
            esac
            if [ "$CLEANUP_TRIGGER_CONFIRMATION" = "RESUME READ ONLY AUDIT" ]; then
              if [ -z "$CLEANUP_AUDIT_RUN_ID" ] || [ -n "$CLEANUP_SESSION_ID" ] || ! [[ "${{ inputs.continuation_request }}" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::Internal READ-ONLY continuation requires one audit ID and a valid parent run ID, never an execute session."
                exit 1
              fi
            elif [ -n "${{ inputs.continuation_request }}" ]; then
              echo "::error::Manual dry-run may not impersonate an automated continuation."
              exit 1
            fi
            if [ -n "$CLEANUP_SESSION_ID" ] && [ -n "$CLEANUP_AUDIT_RUN_ID" ]; then
              echo "::error::Dry-run has two IDs. Fill only continuation_audit and leave continuation_session blank."
              exit 1
            fi
            if [ -n "$CLEANUP_SESSION_ID" ]; then
              echo "::warning::Audit-ID entered under continuation_session: the dry-run runner will safely use it as continuation_audit."
            fi
          fi

      - name: Require exact deployed main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-release-v060.yml/runs?branch=main&status=success&per_page=1")"
          deployed_sha="$(printf '%s' "$response" | jq -r '.workflow_runs[0].head_sha // empty')"
          test -n "$deployed_sha" || { echo "::error::No successful production release was found"; exit 1; }
          test "$deployed_sha" = "$GITHUB_SHA" || {
            echo "::error::Cleanup requires main to match the exact latest successful production release"
            exit 1
          }

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Run QA before production operation
        run: npm run qa

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Create short-lived cleanup-only Worker token
        id: cleanup_token
        shell: bash
        run: |
          set -euo pipefail
          cleanup_token="$(node -e "console.log(Date.now()+'.'+require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$cleanup_token"
          echo "token=$cleanup_token" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$cleanup_token" | npx --yes wrangler@4.114.0 secret put STORAGE_CLEANUP_TOKEN --name "$WORKER_NAME"

      - name: Resolve and verify production Worker URL
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/subdomain" > /tmp/workers-subdomain.json
          jq -e '.success == true and (.result.subdomain | type == "string") and (.result.subdomain | length > 0)' /tmp/workers-subdomain.json >/dev/null
          subdomain="$(jq -r '.result.subdomain' /tmp/workers-subdomain.json)"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts/$WORKER_NAME/subdomain" > /tmp/worker-route.json
          jq -e '.success == true and .result.enabled == true' /tmp/worker-route.json >/dev/null

          worker_url="https://$WORKER_NAME.$subdomain.workers.dev"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$worker_url/health" > /tmp/health.json
          jq -e --arg expected "$GITHUB_SHA" '.ok == true and .service == "kentaurai-api" and .deploymentSha == $expected' /tmp/health.json >/dev/null
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Wait for cleanup auth to propagate
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
          CLEANUP_TOKEN: ${{ steps.cleanup_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            status="$(curl --silent --output /tmp/cleanup-auth.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLEANUP_TOKEN" \
              "$WORKER_URL/v1/storage-cleanup/auth-check" || true)"
            if [ "$status" = "200" ] && jq -e '.ok == true and .scope == "storage_cleanup"' /tmp/cleanup-auth.json >/dev/null 2>&1; then
              echo "Cleanup auth propagated."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Cleanup auth did not propagate within 30 seconds"
          exit 1

      - name: Capture D1 Time Travel restore point
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          restore_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/time_travel/bookmark"
          curl --fail --silent --show-error --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" > /tmp/d1-bookmark.json
          jq -e '.success == true and (.result.bookmark | type == "string") and (.result.bookmark | length > 0)' /tmp/d1-bookmark.json >/dev/null
          bookmark="$(jq -r '.result.bookmark' /tmp/d1-bookmark.json)"
          echo "::add-mask::$bookmark"
          echo "restore_timestamp=$restore_timestamp" >> "$GITHUB_OUTPUT"
          echo "Verified D1 Time Travel restore point at $restore_timestamp."

      - name: Run cleanup
        id: cleanup
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
          ADMIN_TOKEN: ${{ steps.cleanup_token.outputs.token }}
        run: node scripts/run-production-storage-cleanup.mjs

      - name: Remove short-lived cleanup-only Worker token
        if: ${{ always() && steps.cleanup_token.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@4.114.0 secret list --name "$WORKER_NAME" --format json | jq -e '.[] | select(.name == "STORAGE_CLEANUP_TOKEN")' >/dev/null; then
            printf 'y\n' | npx --yes wrangler@4.114.0 secret delete STORAGE_CLEANUP_TOKEN --name "$WORKER_NAME"
          fi

      - name: Verify production health after cleanup run
        if: ${{ always() && steps.worker.outcome == 'success' }}
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$WORKER_URL/health" > /tmp/health-after.json
          jq -e --arg expected "$GITHUB_SHA" '.ok == true and .service == "kentaurai-api" and .deploymentSha == $expected' /tmp/health-after.json >/dev/null
          echo "Production health check passed."

      # Cost- or integrity-stopped runs must fail closed; they can never
      # authorize follow-on GitHub dispatches or data mutations.
      - name: Refuse unsafe or stalled read-only audit
        if: ${{ steps.cleanup.outcome == 'success' && steps.cleanup.outputs.audit_incomplete == 'true' && (steps.cleanup.outputs.progress_made != 'true' || steps.cleanup.outputs.cost_budget_stop == 'true' || steps.cleanup.outputs.audit_safety_stop == 'true') }}
        shell: bash
        run: |
          echo "::error::Read-only audit did not make safe progress or encountered a cost/integrity stop. Review before retrying."
          exit 1

      - name: Cleanup summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "READ-ONLY audit and bounded planning only. NO execution or deletion is enabled."
          echo "Max bounded batches per family: $DRY_RUN_MAX_BATCHES"
          echo "D1 restore timestamp: ${{ steps.restore.outputs.restore_timestamp }}"
          if [ "${{ steps.cleanup.outputs.audit_incomplete }}" = "true" ]; then
            echo "Read-only audit checkpoint: ${{ steps.cleanup.outputs.audit_continuation_count }}/${{ steps.cleanup.outputs.audit_max_continuations }}"
            echo "Audit is incomplete; successful checkpoints will be handed off only after the production job lock is released."
          else
            echo "Audit/planning completed or was safely refused; review this run before authorizing any separate cleanup."
          fi

  queue_read_only:
    name: Queue the next bounded read-only audit after releasing production lock
    needs: cleanup
    if: ${{ needs.cleanup.result == 'success' && needs.cleanup.outputs.audit_incomplete == 'true' && needs.cleanup.outputs.progress_made == 'true' && needs.cleanup.outputs.cost_budget_stop != 'true' && needs.cleanup.outputs.audit_safety_stop != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: "dry-run"
      CONFIRMATION: ${{ inputs.confirmation }}
      DRY_RUN_MAX_BATCHES: ${{ inputs.dry_run_max_batches }}
      CLEANUP_SESSION_ID: ""
      AUDIT_INCOMPLETE: ${{ needs.cleanup.outputs.audit_incomplete }}
      PROGRESS_MADE: ${{ needs.cleanup.outputs.progress_made }}
      COST_BUDGET_STOP: ${{ needs.cleanup.outputs.cost_budget_stop }}
      AUDIT_SAFETY_STOP: ${{ needs.cleanup.outputs.audit_safety_stop }}
      AUDIT_RUN_ID: ${{ needs.cleanup.outputs.audit_run_id }}
      AUDIT_CONTINUATION_COUNT: ${{ needs.cleanup.outputs.audit_continuation_count }}
      AUDIT_MAX_CONTINUATIONS: ${{ needs.cleanup.outputs.audit_max_continuations }}
      AUDIT_EXPIRES_AT: ${{ needs.cleanup.outputs.audit_expires_at }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Refuse a changed main or a different deployed release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha // empty')"
          test "$main_sha" = "$GITHUB_SHA" || { echo "::error::Main changed; stopping the read-only audit chain."; exit 1; }
          releases="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-release-v060.yml/runs?branch=main&status=success&per_page=1")"
          deployed_sha="$(printf '%s' "$releases" | jq -r '.workflow_runs[0].head_sha // empty')"
          test "$deployed_sha" = "$GITHUB_SHA" || { echo "::error::New production release detected; no continuation queued."; exit 1; }

      - name: Queue next bounded READ-ONLY audit continuation
        run: node scripts/queue-production-storage-audit.mjs

      - name: Audit handoff summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "One bounded READ-ONLY audit successor was observed in GitHub Actions. It may wait for a shared production lock; no data cleanup was authorized." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No further continuation was verified. The saved audit remains read-only; review the failed handoff before trying again." >> "$GITHUB_STEP_SUMMARY"
          fi
