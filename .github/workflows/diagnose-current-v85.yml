name: Diagnose current V85 production

on:
  push:
    branches:
      - main
    paths:
      - '.github/diagnose-current-v85.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Diagnose current V85 without exposing private payloads
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DATE="$(sed -n 's/^date=//p' .github/diagnose-current-v85.trigger)"
          test -n "$DATE"
          SQL="
          SELECT 'rounds' AS metric, COUNT(*) AS value FROM game_rounds WHERE game_type='V85' AND round_date='$DATE';
          SELECT 'legs' AS metric, COUNT(*) AS value FROM game_legs gl JOIN game_rounds gr ON gr.id=gl.game_round_id WHERE gr.game_type='V85' AND gr.round_date='$DATE';
          SELECT 'entries' AS metric, COUNT(*) AS value FROM race_entries re JOIN game_legs gl ON gl.race_id=re.race_id JOIN game_rounds gr ON gr.id=gl.game_round_id WHERE gr.game_type='V85' AND gr.round_date='$DATE';
          SELECT 'analysis_ready_rounds' AS metric, COUNT(*) AS value FROM (SELECT gr.id FROM game_rounds gr JOIN game_legs gl ON gl.game_round_id=gr.id WHERE gr.game_type='V85' AND gr.round_date='$DATE' GROUP BY gr.id HAVING COUNT(DISTINCT gl.leg_number)=8);
          SELECT 'entries_missing_usable_name' AS metric, COUNT(*) AS value FROM race_entries re JOIN game_legs gl ON gl.race_id=re.race_id JOIN game_rounds gr ON gr.id=gl.game_round_id LEFT JOIN horses h ON h.id=re.horse_id WHERE gr.game_type='V85' AND gr.round_date='$DATE' AND COALESCE(NULLIF(TRIM(h.canonical_name),''),NULLIF(TRIM(re.declared_horse_name),'')) IS NULL;
          SELECT 'game_sources' AS metric, COUNT(*) AS value FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'game:V85_' || '$DATE' || '_%';
          SELECT 'pending_sources' AS metric, COUNT(*) AS value FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'game:V85_' || '$DATE' || '_%' AND quality_status IN ('captured_unmapped','captured_source_gap');
          SELECT 'missing_identity_gaps' AS metric, COUNT(*) AS value FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'game:V85_' || '$DATE' || '_%' AND quality_status='captured_source_gap' AND json_extract(metadata_json,'$.sourceGap.code')='missing_horse_identity';
          WITH latest AS (SELECT id FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'game:V85_' || '$DATE' || '_%' ORDER BY fetched_at DESC, id DESC LIMIT 1)
            SELECT 'latest_source_normalized' AS metric, COUNT(*) AS value FROM source_records sr, latest WHERE sr.id=latest.id AND sr.quality_status='normalized_verified_subset';
          WITH latest AS (SELECT id FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'game:V85_' || '$DATE' || '_%' ORDER BY fetched_at DESC, id DESC LIMIT 1)
            SELECT 'latest_entry_success' AS metric, COUNT(*) AS value FROM import_runs ir, latest WHERE ir.source_type='official_provider_normalize' AND ir.status='success' AND json_extract(ir.metadata_json,'$.stage')='entry' AND json_extract(ir.metadata_json,'$.sourceRecordId')=latest.id;
          WITH latest AS (SELECT id FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'game:V85_' || '$DATE' || '_%' ORDER BY fetched_at DESC, id DESC LIMIT 1)
            SELECT 'latest_race_entry_observations' AS metric, COUNT(*) AS value FROM normalized_observations no, latest WHERE no.source_record_id=latest.id AND no.entity_type='race_entry';
          WITH latest AS (SELECT id FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'game:V85_' || '$DATE' || '_%' ORDER BY fetched_at DESC, id DESC LIMIT 1)
            SELECT 'latest_entry_failures' AS metric, COUNT(*) AS value FROM import_runs ir, latest WHERE ir.source_type='official_provider_normalize' AND ir.status='failed' AND json_extract(ir.metadata_json,'$.stage')='entry' AND json_extract(ir.metadata_json,'$.sourceRecordId')=latest.id;
          WITH latest AS (SELECT id FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'game:V85_' || '$DATE' || '_%' ORDER BY fetched_at DESC, id DESC LIMIT 1)
            SELECT 'latest_max_success_cursor' AS metric, COALESCE(MAX(CAST(json_extract(ir.metadata_json,'$.cursor') AS INTEGER)),-1) AS value FROM import_runs ir, latest WHERE ir.source_type='official_provider_normalize' AND ir.status='success' AND json_extract(ir.metadata_json,'$.stage')='entry' AND json_extract(ir.metadata_json,'$.sourceRecordId')=latest.id;
          WITH latest AS (SELECT id FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'game:V85_' || '$DATE' || '_%' ORDER BY fetched_at DESC, id DESC LIMIT 1)
            SELECT 'latest_auto_success' AS metric, COUNT(*) AS value FROM import_runs ir, latest WHERE ir.source_type='official_live_normalize_auto' AND ir.status='success' AND json_extract(ir.metadata_json,'$.sourceRecordId')=latest.id;
          WITH latest AS (SELECT id FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'game:V85_' || '$DATE' || '_%' ORDER BY fetched_at DESC, id DESC LIMIT 1)
            SELECT 'latest_auto_failed' AS metric, COUNT(*) AS value FROM import_runs ir, latest WHERE ir.source_type='official_live_normalize_auto' AND ir.status='failed' AND json_extract(ir.metadata_json,'$.sourceRecordId')=latest.id;
          SELECT 'normalize_success' AS metric, COUNT(*) AS value FROM import_runs ir WHERE ir.source_type IN ('official_live_normalize_auto','official_provider_normalize') AND ir.status='success' AND EXISTS (SELECT 1 FROM source_records sr WHERE sr.id=json_extract(ir.metadata_json,'$.sourceRecordId') AND sr.source_type='official_provider' AND sr.external_id LIKE 'game:V85_' || '$DATE' || '_%');
          SELECT 'normalize_failed' AS metric, COUNT(*) AS value FROM import_runs ir WHERE ir.source_type IN ('official_live_normalize_auto','official_provider_normalize') AND ir.status='failed' AND EXISTS (SELECT 1 FROM source_records sr WHERE sr.id=json_extract(ir.metadata_json,'$.sourceRecordId') AND sr.source_type='official_provider' AND sr.external_id LIKE 'game:V85_' || '$DATE' || '_%');
          SELECT 'legacy_missing_id_failures' AS metric, COUNT(*) AS value FROM import_runs ir WHERE ir.source_type IN ('official_live_normalize_auto','official_provider_normalize') AND ir.status='failed' AND json_extract(ir.error_json,'$.message') LIKE '%horse.id is required%' AND EXISTS (SELECT 1 FROM source_records sr WHERE sr.id=json_extract(ir.metadata_json,'$.sourceRecordId') AND sr.source_type='official_provider' AND sr.external_id LIKE 'game:V85_' || '$DATE' || '_%');
          SELECT 'other_recent_failures' AS metric, COUNT(*) AS value FROM import_runs ir WHERE ir.source_type IN ('official_live_normalize_auto','official_provider_normalize') AND ir.status='failed' AND COALESCE(json_extract(ir.error_json,'$.message'),'') NOT LIKE '%horse.id is required%' AND EXISTS (SELECT 1 FROM source_records sr WHERE sr.id=json_extract(ir.metadata_json,'$.sourceRecordId') AND sr.source_type='official_provider' AND sr.external_id LIKE 'game:V85_' || '$DATE' || '_%');
          "
          npx --yes wrangler@4.114.0 d1 execute kentaurai --remote --command "$SQL"
