name: Release KentaurAI v0.6.0 production
run-name: Release KentaurAI v0.6.0 production — @${{ github.actor }}

on:
  push:
    branches:
      - main
    paths:
      - '.github/production-release-v060.trigger'

permissions:
  contents: read

concurrency:
  group: kentaurai-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate release marker and source build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'release=kentaurai-v0.6.0' .github/production-release-v060.trigger
          source_main="$(sed -n 's/^source_main=//p' .github/production-release-v060.trigger)"
          test -n "$source_main" || { echo 'source_main is missing from release marker'; exit 1; }
          test "$(printf '%s' "$source_main" | tr -cd '0-9a-f' | wc -c)" -eq 40 || { echo 'source_main must be a full 40-character lowercase commit SHA'; exit 1; }
          test "$(printf '%s' "$source_main" | wc -c)" -eq 40 || { echo 'source_main must be a full 40-character lowercase commit SHA'; exit 1; }
          git cat-file -e "$source_main^{commit}"
          git merge-base --is-ancestor "$source_main" HEAD
          grep -Fq '"main": "./src/worker-v074.js"' wrangler.jsonc

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Run full QA before production changes
        run: npm run qa

      - name: Validate Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }

      - name: Apply pending production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote

      - name: Verify required production schema without exposing production data
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 d1 execute kentaurai --remote --command "SELECT street_address, postal_code, website_url FROM tracks LIMIT 0; SELECT metrics_json, notes, spike_count FROM systems LIMIT 0; SELECT horse_id, observed_at, age_years, source_record_id FROM horse_profile_snapshots LIMIT 0; SELECT horse_id, snapshot_scope, observed_at, source_record_id FROM horse_stat_snapshots LIMIT 0; SELECT person_type, person_id, stat_year, observed_at, source_record_id FROM person_stat_snapshots LIMIT 0; SELECT race_id, source_observation_id, source_record_id, observed_at, parser_version, parse_status FROM race_proposition_facts LIMIT 0; SELECT race_entry_id, source_record_id, interval_start_m, interval_end_m, elapsed_ms, km_pace_ms, local_frame_coverage, eligibility_status, mapper_version FROM xlabs_intervals LIMIT 0; SELECT race_entry_id, source_record_id, checkpoint_key, position_rank, meters_behind_leader, relative_lateral_offset_m, field_coverage, reconstruction_version FROM race_position_checkpoints LIMIT 0; SELECT race_id, race_entry_id, source_record_id, episode_type, confidence, reconstruction_version FROM race_trajectory_episodes LIMIT 0; SELECT race_entry_id, source_record_id, frame_coverage, reconstruction_status, reconstruction_version FROM race_trajectory_summaries LIMIT 0; SELECT id, start_date, end_date, status, reconstruction_version FROM xlabs_position_reconstruction_jobs LIMIT 0; SELECT id, game_round_id, contract_version, pack_id, pack_as_of, facts_fingerprint, provider, model, prompt_version, lock_hash, created_at FROM analysis_step1_locks LIMIT 0; SELECT child_lock_id, parent_lock_id, game_round_id, contract_version, parent_facts_fingerprint, child_facts_fingerprint, affected_legs_json, revision_hash, created_at FROM analysis_step1_lock_revisions LIMIT 0; SELECT id, game_round_id, lock_id, lock_hash, market_fingerprint, market_cutoff, contract_version, decision_probability_version, policy_version, decision_fingerprint, created_at FROM analysis_decision_runs LIMIT 0; SELECT decision_run_id, leg_number, race_entry_id, blind_probability, public_win_probability_proxy, public_proxy_quality, decision_probability FROM analysis_decision_probabilities LIMIT 0; SELECT id, game_round_id, decision_run_id, decision_fingerprint, contract_version, optimizer_version, policy_version, line_price_sek, target_budget_min_sek, max_budget_sek, spike_count, row_count, cost_sek, estimated_p8, optimizer_fingerprint, created_at FROM analysis_optimizer_runs LIMIT 0; SELECT optimizer_run_id, leg_number, race_entry_id, is_spike, decision_probability FROM analysis_optimizer_selections LIMIT 0; SELECT id, game_round_id, lock_id, lock_hash, market_fingerprint, market_cutoff, contract_version, step2_version, prompt_version, provider, model, result_fingerprint, created_at FROM analysis_step2_results LIMIT 0; SELECT id, game_round_id, lock_id, lock_hash, market_fingerprint, market_cutoff, step2_result_id, decision_run_id, optimizer_run_id, contract_version, analysis_version, step2_version, decision_probability_version, optimizer_version, step2_fingerprint, decision_fingerprint, optimizer_fingerprint, analysis_fingerprint, narrative_fingerprint, created_at FROM analysis_v3_runs LIMIT 0; SELECT id, contract_version, replay_version, track, status, cohort_fingerprint, evaluation_fingerprint, result_fingerprint, target_count, fold_count, created_at FROM replay_runs LIMIT 0; SELECT replay_run_id, target_id, target_group_id, target_at, forecast_variant, winner_entry_id, log_loss, brier_score, winner_rank FROM forecast_evaluations LIMIT 0; SELECT replay_run_id, ablation_id, feature_family, mode, target_count, delta_log_loss, delta_brier FROM replay_ablation_results LIMIT 0; SELECT name FROM sqlite_master WHERE type='table' AND name IN ('race_stl_classifications','race_type_classifications','horse_record_snapshots','official_snapshot_source_sync','race_proposition_facts','xlabs_intervals','race_position_checkpoints','race_trajectory_episodes','race_trajectory_summaries','xlabs_position_reconstruction_jobs','analysis_step1_locks','analysis_step1_lock_revisions','analysis_decision_runs','analysis_decision_probabilities','analysis_optimizer_runs','analysis_optimizer_selections','analysis_step2_results','analysis_v3_runs','replay_runs','forecast_evaluations','replay_ablation_results') ORDER BY name; SELECT name FROM d1_migrations WHERE name IN ('0008_track_contact_metadata.sql','0013_combined_analysis_systems.sql','0015_official_snapshot_promotion.sql','0016_race_proposition_facts.sql','0017_xlabs_intervals_v2.sql','0018_xlabs_position_reconstruction_v1.sql','0019_analysis_step1_locks.sql','0020_analysis_step1_lock_revisions.sql','0021_analysis_decision_probability_v1.sql','0022_analysis_optimizer_v1.sql','0023_analysis_step2_integration_v1.sql','0024_replay_calibration_v1.sql') ORDER BY name;" > /tmp/migration-check.txt
          grep -q 'race_stl_classifications' /tmp/migration-check.txt
          grep -q 'race_type_classifications' /tmp/migration-check.txt
          grep -q 'horse_record_snapshots' /tmp/migration-check.txt
          grep -q 'official_snapshot_source_sync' /tmp/migration-check.txt
          grep -q 'race_proposition_facts' /tmp/migration-check.txt
          grep -q 'xlabs_intervals' /tmp/migration-check.txt
          grep -q 'race_position_checkpoints' /tmp/migration-check.txt
          grep -q 'race_trajectory_episodes' /tmp/migration-check.txt
          grep -q 'race_trajectory_summaries' /tmp/migration-check.txt
          grep -q 'xlabs_position_reconstruction_jobs' /tmp/migration-check.txt
          grep -q 'analysis_step1_locks' /tmp/migration-check.txt
          grep -q 'analysis_step1_lock_revisions' /tmp/migration-check.txt
          grep -q 'analysis_decision_runs' /tmp/migration-check.txt
          grep -q 'analysis_decision_probabilities' /tmp/migration-check.txt
          grep -q 'analysis_optimizer_runs' /tmp/migration-check.txt
          grep -q 'analysis_optimizer_selections' /tmp/migration-check.txt
          grep -q 'analysis_step2_results' /tmp/migration-check.txt
          grep -q 'analysis_v3_runs' /tmp/migration-check.txt
          grep -q 'replay_runs' /tmp/migration-check.txt
          grep -q 'forecast_evaluations' /tmp/migration-check.txt
          grep -q 'replay_ablation_results' /tmp/migration-check.txt
          grep -q '0008_track_contact_metadata.sql' /tmp/migration-check.txt
          grep -q '0013_combined_analysis_systems.sql' /tmp/migration-check.txt
          grep -q '0015_official_snapshot_promotion.sql' /tmp/migration-check.txt
          grep -q '0016_race_proposition_facts.sql' /tmp/migration-check.txt
          grep -q '0017_xlabs_intervals_v2.sql' /tmp/migration-check.txt
          grep -q '0018_xlabs_position_reconstruction_v1.sql' /tmp/migration-check.txt
          grep -q '0019_analysis_step1_locks.sql' /tmp/migration-check.txt
          grep -q '0020_analysis_step1_lock_revisions.sql' /tmp/migration-check.txt
          grep -q '0021_analysis_decision_probability_v1.sql' /tmp/migration-check.txt
          grep -q '0022_analysis_optimizer_v1.sql' /tmp/migration-check.txt
          grep -q '0023_analysis_step2_integration_v1.sql' /tmp/migration-check.txt
          grep -q '0024_replay_calibration_v1.sql' /tmp/migration-check.txt

      - name: Deploy Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm run deploy 2>&1 | tee /tmp/kentaurai-deploy.log
          worker_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/kentaurai-deploy.log | tail -n 1)"
          test -n "$worker_url" || { echo 'Could not determine workers.dev URL from Wrangler output'; exit 1; }
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed public health endpoint and exact app version
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$WORKER_URL/health" > /tmp/health.json
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); if(h.ok!==true||h.service!=='kentaurai-api'||h.version!=='0.6.0') process.exit(1);"

      - name: Verify private app login remains available
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/login.html --write-out '%{http_code}' "$WORKER_URL/app/login")"
          test "$status" = '200' || { echo "Expected /app/login 200, got $status"; exit 1; }
          test -s /tmp/login.html

      - name: Verify private analysis routes are deployed and protected
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for path in \
            '/app/api/settings/analysis-prompt?provider=anthropic' \
            '/app/api/settings/analysis-method-prompt?step=1' \
            '/app/api/settings/export?provider=anthropic&stage=pre_market' \
            '/app/api/settings/analysis-step1-revision-prompt?provider=openai' \
            '/v1/analysis-pack/private-probe' \
            '/v1/analysis-step1-lock/private-probe' \
            '/v1/analysis-step1-prompt?provider=openai' \
            '/v1/analysis-step1-revision/private-probe' \
            '/v1/analysis-step1-revision-prompt?provider=openai' \
            '/v1/analysis-decision-probability/private-probe' \
            '/v1/analysis-optimizer/private-probe' \
            '/v1/analysis-step2-prompt?provider=openai' \
            '/v1/analysis-step2/private-probe' \
            '/v1/analysis-v3/private-probe' \
            '/v1/replay/private-probe'; do
            status="$(curl --silent --show-error --output /tmp/private-response.json --write-out '%{http_code}' "$WORKER_URL$path")"
            test "$status" = '401' || { echo "Expected $path to return 401 without authorization, got $status"; cat /tmp/private-response.json; exit 1; }
            grep -q 'unauthorized' /tmp/private-response.json
          done

      - name: Release summary
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          echo 'KentaurAI v0.6.0 production release completed.'
          echo "Worker: $WORKER_URL"
          echo 'Required production schema through migration 0024, F1 replay storage, worker-v074, D3 revision lineage, E1 decision probability storage, E2 optimizer storage, E3 Step 2/integrated analysis storage, exact app version, health, login and private analysis/replay route checks passed.'