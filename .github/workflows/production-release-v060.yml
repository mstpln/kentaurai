          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$WORKER_URL/health/entity-detail-ui" > /tmp/entity-detail-ui.json
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/entity-detail-ui.json','utf8')); if(h.ok!==true||h.service!=='kentaurai-api'||h.check!=='entity-detail-ui'||h.version!=='core-owner-v1'||!h.checks||Object.values(h.checks).some(v=>v!==true)) process.exit(1);"

      - name: Verify private analysis routes are deployed and protected
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for path in \
            '/app/api/settings/status' \
            '/app/api/settings/alerts' \
            '/app/api/settings/analysis-prompt?provider=anthropic' \
            '/app/api/settings/analysis-method-prompt?step=1' \
            '/app/api/settings/export?provider=anthropic&stage=pre_market' \
            '/app/api/settings/analysis-step1-revision-prompt?provider=openai' \
            '/app/api/settings/f3-rounds' \
            '/app/api/settings/f3-workflow-state?round_id=private-probe' \
            '/app/api/settings/f3-analysis-pack?round_id=private-probe' \
            '/app/api/settings/f4-step2-bundle?round_id=private-probe' \
            '/app/api/settings/f3-operational-status' \
            '/app/api/settings/external-rounds?scope=analysis' \
            '/app/api/tracks/private-probe/analysis?start_method=all&distance_group=all' \
            '/app/api/settings/external-step1-prompt?provider=openai' \
            '/app/api/settings/external-market?round_id=private-probe' \
            '/app/api/settings/external-step2-prompt?provider=openai' \
            '/app/api/settings/external-evidence-context?round_id=private-probe' \
            '/app/api/settings/external-step3-prompt?provider=openai' \
            '/app/api/settings/external-evidence-import-context?round_id=private-probe' \
            '/app/api/settings/external-evidence-import-prompt?provider=openai' \
            '/app/api/horses/private-probe/external-statistics' \
            '/app/api/horses/private-probe/interviews' \
            '/app/api/trainers/private-probe/interviews' \
            '/app/api/settings/system-import-context?round_id=private-probe' \
            '/app/api/settings/system-import-prompt?provider=openai' \
            '/app/api/games/statistics' \
            '/v1/game-statistics/coverage' \
            '/v1/game-statistics/backfill-status' \
            '/v1/analysis-pack/private-probe' \
            '/v1/analysis-step1-lock/private-probe' \
            '/v1/analysis-step1-prompt?provider=openai' \
            '/v1/analysis-step1-revision/private-probe' \
            '/v1/analysis-step1-revision-prompt?provider=openai' \
            '/v1/analysis-decision-probability/private-probe' \
            '/v1/analysis-optimizer/private-probe' \
            '/v1/analysis-step2-prompt?provider=openai' \
            '/v1/analysis-step2/private-probe' \
            '/v1/analysis-v3/private-probe' \
            '/v1/replay/private-probe' \
            '/v1/xlabs/interval-repair' \
            '/v1/admin/tracks/profile-targets' \
            '/v1/post-race/settlement/private-probe'; do
            status="$(curl --silent --show-error --output /tmp/private-response.json --write-out '%{http_code}' "$WORKER_URL$path")"
            test "$status" = '401' || { echo "Expected $path to return 401 without authorization, got $status"; cat /tmp/private-response.json; exit 1; }
            grep -q 'unauthorized' /tmp/private-response.json
          done

          status="$(curl --silent --show-error --request POST --header 'content-type: application/json' --data '{}' --output /tmp/private-response.json --write-out '%{http_code}' "$WORKER_URL/v1/game-statistics/backfill-next")"
          test "$status" = '401' || { echo "Expected /v1/game-statistics/backfill-next to return 401 without authorization, got $status"; cat /tmp/private-response.json; exit 1; }
          grep -q 'unauthorized' /tmp/private-response.json

          status="$(curl --silent --show-error --request POST --header 'content-type: application/json' --data '{}' --output /tmp/private-response.json --write-out '%{http_code}' "$WORKER_URL/app/api/settings/alerts/acknowledge")"
          test "$status" = '401' || { echo "Expected /app/api/settings/alerts/acknowledge to return 401 without authorization, got $status"; cat /tmp/private-response.json; exit 1; }
          grep -q 'unauthorized' /tmp/private-response.json

          status="$(curl --silent --show-error --request POST --header 'content-type: application/json' --data '{"tracks":[]}' --output /tmp/private-response.json --write-out '%{http_code}' "$WORKER_URL/v1/admin/tracks/profile-enrichment")"
          test "$status" = '401' || { echo "Expected /v1/admin/tracks/profile-enrichment to return 401 without authorization, got $status"; cat /tmp/private-response.json; exit 1; }
          grep -q 'unauthorized' /tmp/private-response.json

      - name: Release summary
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          echo 'KentaurAI v0.6.0 production release completed.'
          echo "Worker: $WORKER_URL"
          echo 'Required production schema through migration 0040, Settings alert acknowledgement storage, track physical-profile and Bananalys read-index storage, X-Labs interval repair state, external analysis lineage/evidence storage, external F1/F2 evidence integration, worker-v078 runtime, controlled legacy boundary, exact app version, health, login and private route checks passed.'