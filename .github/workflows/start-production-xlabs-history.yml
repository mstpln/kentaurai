name: Start production X-Labs history
run-name: Start production X-Labs history — @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type START XLABS HISTORY 2023-09-08 TO 2026-09-07 to authorize the production job
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kentaurai-production-xlabs-history-start
  cancel-in-progress: false

jobs:
  start:
    if: ${{ inputs.confirmation == 'START XLABS HISTORY 2023-09-08 TO 2026-09-07' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Run QA before production change
        run: npm run qa

      - name: Start or resume fixed production X-Labs history job
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
          JOB_ID: xlabsbackfill_xlabs-race-v1__historical-all__2023-09-08__2026-09-07
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          d1_query() {
            local sql="$1"
            local code
            code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" \
              "$api")"
            [[ "$code" == "200" ]] || { echo "Cloudflare D1 query failed (HTTP $code)"; exit 1; }
            jq -e '.success == true and (.result | length >= 1) and (.result | all(.success == true))' "$response_file" > /dev/null || {
              echo "Cloudflare D1 query returned an unsuccessful result";
              exit 1;
            }
          }

          preflight_sql="SELECT COALESCE(SUM(CASE WHEN id = '$JOB_ID' THEN 1 ELSE 0 END), 0) AS exact_jobs, COALESCE(SUM(CASE WHEN scope = 'historical_all' AND status = 'running' AND id <> '$JOB_ID' THEN 1 ELSE 0 END), 0) AS other_running, MAX(CASE WHEN id = '$JOB_ID' THEN status ELSE NULL END) AS exact_status FROM xlabs_backfill_jobs;"
          d1_query "$preflight_sql"
          exact_jobs="$(jq -r '.result[0].results[0].exact_jobs' "$response_file")"
          other_running="$(jq -r '.result[0].results[0].other_running' "$response_file")"
          exact_status="$(jq -r '.result[0].results[0].exact_status // "absent"' "$response_file")"

          [[ "$exact_jobs" == "0" || "$exact_jobs" == "1" ]] || { echo "Unexpected duplicate fixed X-Labs job state"; exit 1; }
          [[ "$other_running" == "0" ]] || { echo "Another historical X-Labs job is already running; refusing to create overlap"; exit 1; }

          case "$exact_status" in
            absent)
              mutation_sql="INSERT OR IGNORE INTO xlabs_backfill_jobs (id, scope, start_date, end_date, next_date, status) VALUES ('$JOB_ID', 'historical_all', '2023-09-08', '2026-09-07', '2026-09-07', 'running');"
              d1_query "$mutation_sql"
              ;;
            failed)
              mutation_sql="UPDATE xlabs_backfill_jobs SET status = CASE WHEN next_date >= start_date THEN 'running' ELSE status END, consecutive_errors = 0, last_error = NULL, retry_after = NULL, updated_at = CURRENT_TIMESTAMP WHERE id = '$JOB_ID' AND status = 'failed';"
              d1_query "$mutation_sql"
              ;;
            running|completed)
              ;;
            *)
              echo "Unexpected fixed X-Labs job status"
              exit 1
              ;;
          esac

          postflight_sql="SELECT id, scope, start_date, end_date, next_date, status, consecutive_errors, (SELECT COUNT(*) FROM xlabs_backfill_jobs WHERE scope = 'historical_all' AND status = 'running' AND id <> '$JOB_ID') AS other_running FROM xlabs_backfill_jobs WHERE id = '$JOB_ID' LIMIT 1;"
          d1_query "$postflight_sql"
          jq -e --arg id "$JOB_ID" '.result[0].results | length == 1 and .[0].id == $id and .[0].scope == "historical_all" and .[0].start_date == "2023-09-08" and .[0].end_date == "2026-09-07" and (.[0].status == "running" or .[0].status == "completed") and .[0].other_running == 0' "$response_file" > /dev/null || {
            echo "Production X-Labs historical job did not reach the expected safe state";
            exit 1;
          }

          final_status="$(jq -r '.result[0].results[0].status' "$response_file")"
          if [[ "$final_status" == "completed" ]]; then
            echo "Production X-Labs historical job was already completed; no new job was created."
          else
            echo "Production X-Labs historical job is running."
          fi
