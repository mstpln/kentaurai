name: Inspect X-Labs structural source gap

on:
  push:
    branches:
      - ops/backfill-coverage-assessment-v067
    paths:
      - .github/workflows/assess-production-history-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production X-Labs failure context
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          query() {
            local sql="$1"
            local code
            code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json' --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" "$api")"
            [[ "$code" == "200" ]]
            jq -e '.success == true and (.result | all(.success == true))' "$response_file" >/dev/null
          }
          query "SELECT status,next_date,next_race_index,processed_races,unavailable_races,consecutive_errors,last_error,retry_after,last_run_at FROM xlabs_backfill_jobs WHERE scope='historical_all' ORDER BY created_at DESC LIMIT 1;"
          echo "X-Labs job:"; jq -c '.result[0].results[0] // {}' "$response_file"
          query "SELECT id,status,started_at,finished_at,error_json,metadata_json FROM import_runs WHERE source_type='xlabs_telemetry_normalize' AND status='failed' AND error_json LIKE '%duplicate target%' ORDER BY started_at DESC LIMIT 10;"
          echo "Duplicate-target normalization failures:"; jq -c '.result[0].results' "$response_file"
          query "SELECT sr.id,sr.external_id,sr.fetched_at,sr.quality_status,sr.metadata_json FROM source_records sr WHERE sr.id IN (SELECT DISTINCT json_extract(metadata_json,'$.sourceRecordId') FROM import_runs WHERE source_type='xlabs_telemetry_normalize' AND status='failed' AND error_json LIKE '%duplicate target%') ORDER BY sr.fetched_at DESC LIMIT 10;"
          echo "Affected X-Labs sources:"; jq -c '.result[0].results' "$response_file"
          query "SELECT status,next_date,next_race_index,processed_races,consecutive_errors,last_error,last_run_at FROM historical_backfill_jobs WHERE id='backfill_official-se-trot-v2__2023-09-08__2026-09-07' LIMIT 1;"
          echo "Official history:"; jq -c '.result[0].results[0] // {}' "$response_file"
