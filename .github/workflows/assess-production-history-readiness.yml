name: Verify production source-gap resilience

on:
  push:
    branches:
      - ops/backfill-coverage-assessment-v067
    paths:
      - .github/workflows/assess-production-history-readiness.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production state only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          query() {
            local sql="$1"
            local code
            code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json' --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" "$api")"
            [[ "$code" == "200" ]]
            jq -e '.success == true and (.result | all(.success == true))' "$response_file" >/dev/null
          }

          query "SELECT status,next_date,next_race_index,processed_dates,processed_races,reused_races,consecutive_errors,last_error,last_run_at,updated_at FROM historical_backfill_jobs WHERE id='backfill_official-se-trot-v2__2023-09-08__2026-09-07' LIMIT 1;"
          echo "Official history:"; jq -c '.result[0].results[0] // {}' "$response_file"

          query "SELECT status,next_date,next_race_index,processed_dates,processed_races,reused_races,unavailable_dates,unavailable_races,consecutive_errors,last_error,retry_after,last_run_at,updated_at FROM xlabs_backfill_jobs WHERE id='xlabsbackfill_xlabs-race-v1__historical-all__2023-09-08__2026-09-07' LIMIT 1;"
          echo "X-Labs history:"; jq -c '.result[0].results[0] // {}' "$response_file"

          query "SELECT external_id,quality_status,metadata_json,fetched_at FROM source_records WHERE id='src_4bf4ac1f-8a64-4232-85e6-f76061b6519d' LIMIT 1;"
          echo "Recovered X-Labs source:"; jq -c '.result[0].results[0] // {}' "$response_file"

          query "SELECT external_id,quality_status,metadata_json,fetched_at FROM source_records WHERE source_type='official_provider' AND external_id='game:V85_2026-09-13_78_5' ORDER BY fetched_at DESC LIMIT 4;"
          echo "Upcoming V85 sources:"; jq -c '.result[0].results' "$response_file"

          query "SELECT status,started_at,finished_at,error_count,error_json,metadata_json FROM import_runs WHERE source_type='scheduled_orchestrator' ORDER BY started_at DESC LIMIT 8;"
          echo "Recent orchestrators:"; jq -c '.result[0].results' "$response_file"
