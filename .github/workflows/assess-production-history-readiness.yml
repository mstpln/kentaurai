name: Assess production history readiness

on:
  push:
    branches:
      - ops/backfill-coverage-assessment-v067
    paths:
      - .github/workflows/assess-production-history-readiness.yml
      - src/routes/production-readiness.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query aggregate production readiness
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare token is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account id is not configured"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          query() {
            local sql="$1"
            local code
            code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" \
              "$api")"
            [[ "$code" == "200" ]] || { echo "D1 query failed (HTTP $code)"; exit 1; }
            jq -e '.success == true and (.result | length >= 1) and (.result | all(.success == true))' "$response_file" > /dev/null || {
              echo "D1 query returned an unsuccessful result";
              exit 1;
            }
          }

          query "SELECT status,start_date,end_date,next_date,next_race_index,processed_dates,processed_races,reused_races,consecutive_errors,last_error,last_run_at,updated_at FROM historical_backfill_jobs WHERE start_date='2023-09-08' AND end_date='2026-09-07' ORDER BY created_at DESC LIMIT 1;"
          echo "Official backfill:"
          jq -c '.result[0].results[0] // {}' "$response_file"

          query "SELECT status,start_date,end_date,next_date,next_race_index,processed_dates,processed_races,reused_races,unavailable_dates,unavailable_races,consecutive_errors,last_error,retry_after,last_run_at,updated_at FROM xlabs_backfill_jobs WHERE scope='historical_all' AND start_date='2023-09-08' AND end_date='2026-09-07' ORDER BY created_at DESC LIMIT 1;"
          echo "X-Labs backfill:"
          jq -c '.result[0].results[0] // {}' "$response_file"

          query "SELECT source_type,status,started_at,finished_at,error_count,error_json,metadata_json FROM import_runs WHERE source_type='scheduled_orchestrator' ORDER BY started_at DESC LIMIT 5;"
          echo "Recent orchestrators:"
          jq -c '.result[0].results' "$response_file"

          query "SELECT external_id,quality_status,fetched_at,raw_object_key FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'race:2026-08-15_%' ORDER BY external_id,fetched_at DESC;"
          echo "Official race sources for 2026-08-15:"
          jq -c '.result[0].results' "$response_file"

          query "SELECT id,race_number,track_id,source_quality FROM races WHERE race_date='2026-08-15' ORDER BY id;"
          echo "Normalized races for 2026-08-15:"
          jq -c '.result[0].results' "$response_file"

# investigate failing official historical checkpoint 2026-09-10
