name: Verify production source-gap resilience

on:
  push:
    branches:
      - ops/backfill-coverage-assessment-v067
    paths:
      - .github/workflows/assess-production-history-readiness.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production state only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          query() {
            local sql="$1"
            local code
            code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json' --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" "$api")"
            [[ "$code" == "200" ]]
            jq -e '.success == true and (.result | all(.success == true))' "$response_file" >/dev/null
          }

          query "SELECT id,scope,start_date,end_date,next_date,next_race_index,status,processed_dates,processed_races,unavailable_dates,unavailable_races,consecutive_errors,last_error,retry_after,last_run_at,created_at,updated_at FROM xlabs_backfill_jobs WHERE scope='daily_v85_v86' ORDER BY start_date DESC LIMIT 20;"
          echo "Daily X-Labs jobs:"; jq -c '.result[0].results' "$response_file"

          query "SELECT external_id,quality_status,fetched_at FROM source_records WHERE source_type='official_provider' AND external_id LIKE 'calendar:2026-09-%' ORDER BY fetched_at DESC LIMIT 40;"
          echo "Recent official calendars:"; jq -c '.result[0].results' "$response_file"

          query "SELECT id,game_type,round_date FROM game_rounds WHERE round_date >= '2026-09-07' ORDER BY round_date DESC,id;"
          echo "Recent normalized rounds:"; jq -c '.result[0].results' "$response_file"

          query "SELECT status,started_at,finished_at,error_count,error_json,metadata_json FROM import_runs WHERE source_type='scheduled_orchestrator' ORDER BY started_at DESC LIMIT 12;"
          echo "Recent orchestrators:"; jq -c '.result[0].results' "$response_file"

# daily X-Labs prerequisite investigation 2026-09-10
