name: Quarantine X-Labs source gap and resume history

on:
  push:
    branches:
      - ops/backfill-coverage-assessment-v067
    paths:
      - .github/workflows/assess-production-history-readiness.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guarded production recovery
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          query() {
            local sql="$1"
            local code
            code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json' --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" "$api")"
            [[ "$code" == "200" ]]
            jq -e '.success == true and (.result | all(.success == true))' "$response_file" >/dev/null
          }

          job_id='xlabsbackfill_xlabs-race-v1__historical-all__2023-09-08__2026-09-07'
          source_id='src_4bf4ac1f-8a64-4232-85e6-f76061b6519d'
          query "SELECT status,next_date,next_race_index,processed_races,unavailable_races,consecutive_errors,last_error FROM xlabs_backfill_jobs WHERE id='$job_id' LIMIT 1;"
          echo "Before recovery:"; jq -c '.result[0].results[0] // {}' "$response_file"
          jq -e '.result[0].results[0] | .status == "failed" and .next_date == "2026-08-15" and .next_race_index == 0 and .processed_races == 131 and .unavailable_races == 60 and .consecutive_errors == 3 and .last_error == "X-Labs telemetry frame 0 contains duplicate target 9"' "$response_file" >/dev/null || { echo "Guard failed: X-Labs job state changed; refusing mutation"; exit 1; }

          query "SELECT external_id,quality_status FROM source_records WHERE id='$source_id' AND source_type='xlabs_race_json' LIMIT 1;"
          jq -e '.result[0].results[0] | .external_id == "2026-08-15:6:1" and .quality_status == "captured_unmapped"' "$response_file" >/dev/null || { echo "Guard failed: source state changed; refusing mutation"; exit 1; }

          query "UPDATE source_records SET quality_status='captured_source_gap', metadata_json=json_set(COALESCE(metadata_json,'{}'),'$.normalizationStatus','source_gap','$.sourceGap.code','duplicate_target','$.sourceGap.frameIndex',0,'$.sourceGap.startNumber',9) WHERE id='$source_id' AND source_type='xlabs_race_json' AND external_id='2026-08-15:6:1' AND quality_status='captured_unmapped';"
          [[ "$(jq -r '.result[0].meta.changes // 0' "$response_file")" == "1" ]] || { echo "Source quarantine did not change exactly one row"; exit 1; }

          query "UPDATE xlabs_backfill_jobs SET status='running', next_race_index=1, processed_races=processed_races+1, unavailable_races=unavailable_races+1, consecutive_errors=0, last_error=NULL, retry_after=NULL, lease_token=NULL, lease_until=NULL, last_run_at=CURRENT_TIMESTAMP, updated_at=CURRENT_TIMESTAMP WHERE id='$job_id' AND status='failed' AND next_date='2026-08-15' AND next_race_index=0 AND processed_races=131 AND unavailable_races=60 AND consecutive_errors=3 AND last_error='X-Labs telemetry frame 0 contains duplicate target 9';"
          [[ "$(jq -r '.result[0].meta.changes // 0' "$response_file")" == "1" ]] || { echo "Job recovery did not change exactly one row"; exit 1; }

          query "SELECT status,next_date,next_race_index,processed_races,unavailable_races,consecutive_errors,last_error,retry_after FROM xlabs_backfill_jobs WHERE id='$job_id' LIMIT 1;"
          echo "After recovery:"; jq -c '.result[0].results[0] // {}' "$response_file"
          jq -e '.result[0].results[0] | .status == "running" and .next_date == "2026-08-15" and .next_race_index == 1 and .processed_races == 132 and .unavailable_races == 61 and .consecutive_errors == 0 and .last_error == null and .retry_after == null' "$response_file" >/dev/null
