name: Assess production history

on:
  push:
    branches:
      - ops/backfill-coverage-assessment-v067
    paths:
      - .github/workflows/assess-production-history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read aggregate production coverage
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare token is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account id is not configured"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          query() {
            local sql="$1"
            local code
            code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json' --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" "$api")"
            [[ "$code" == "200" ]] || { echo "Production read failed (HTTP $code)"; exit 1; }
            jq -e '.success == true and (.result | length >= 1) and (.result | all(.success == true))' "$response_file" > /dev/null || { echo "Production read returned an unsuccessful result"; exit 1; }
          }

          query "SELECT status, next_date, next_race_index, processed_dates, processed_races, reused_races, consecutive_errors, last_run_at FROM historical_backfill_jobs WHERE start_date='2023-09-08' AND end_date='2026-09-07' ORDER BY created_at DESC LIMIT 1;"
          echo "OFFICIAL BACKFILL"
          jq -c '.result[0].results[0] // null' "$response_file"

          query "SELECT status, next_date, next_race_index, processed_dates, processed_races, reused_races, unavailable_dates, unavailable_races, consecutive_errors, retry_after, last_run_at FROM xlabs_backfill_jobs WHERE scope='historical_all' AND start_date='2023-09-08' AND end_date='2026-09-07' ORDER BY created_at DESC LIMIT 1;"
          echo "X-LABS BACKFILL"
          jq -c '.result[0].results[0] // null' "$response_file"

          query "SELECT (SELECT COUNT(*) FROM races) AS races, (SELECT COUNT(DISTINCT re.race_id) FROM race_entries re JOIN race_results rr ON rr.race_entry_id=re.id) AS races_with_results, (SELECT COUNT(*) FROM race_entries re JOIN race_results rr ON rr.race_entry_id=re.id WHERE re.scratched=0 AND rr.result_status IS NOT NULL) AS completed_entries, (SELECT MIN(r.race_date) FROM race_entries re JOIN races r ON r.id=re.race_id JOIN race_results rr ON rr.race_entry_id=re.id WHERE re.scratched=0 AND rr.result_status IS NOT NULL) AS earliest_result_date, (SELECT MAX(r.race_date) FROM race_entries re JOIN races r ON r.id=re.race_id JOIN race_results rr ON rr.race_entry_id=re.id WHERE re.scratched=0 AND rr.result_status IS NOT NULL) AS latest_result_date, (SELECT COUNT(DISTINCT race_entry_id) FROM xlabs_data WHERE quality_status='normalized_verified_subset') AS xlabs_entries;"
          echo "HISTORY TOTALS"
          jq -c '.result[0].results[0]' "$response_file"

          for entity in horse_id driver_id trainer_id; do
            query "WITH c AS (SELECT re.$entity AS entity_id, SUM(CASE WHEN r.race_date>=date('now','-14 day') THEN 1 ELSE 0 END) d14, SUM(CASE WHEN r.race_date>=date('now','-28 day') THEN 1 ELSE 0 END) d28, SUM(CASE WHEN r.race_date>=date('now','-90 day') THEN 1 ELSE 0 END) d90, SUM(CASE WHEN r.race_date>=date('now','-180 day') THEN 1 ELSE 0 END) d180, SUM(CASE WHEN r.race_date>=date('now','-365 day') THEN 1 ELSE 0 END) d365 FROM race_entries re JOIN races r ON r.id=re.race_id JOIN race_results rr ON rr.race_entry_id=re.id WHERE re.scratched=0 AND rr.result_status IS NOT NULL AND re.$entity IS NOT NULL GROUP BY re.$entity) SELECT COUNT(*) entities, SUM(d14>=3) d14_ge3, SUM(d14>=5) d14_ge5, SUM(d28>=3) d28_ge3, SUM(d28>=5) d28_ge5, SUM(d90>=5) d90_ge5, SUM(d90>=10) d90_ge10, SUM(d180>=10) d180_ge10, SUM(d365>=10) d365_ge10 FROM c;"
            echo "TREND SAMPLE COVERAGE $entity"
            jq -c '.result[0].results[0]' "$response_file"
          done
