name: Resume official history after PR257

on:
  push:
    branches:
      - ops/resume-history-after-pr257
    paths:
      - '.github/workflows/resume-official-history-after-pr257.yml'

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Resume failed long official history job
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.114.0 d1 execute kentaurai --remote --command "
            UPDATE historical_backfill_jobs
            SET status=CASE WHEN next_date >= start_date THEN 'running' ELSE status END,
                consecutive_errors=0,
                last_error=NULL,
                lease_token=NULL,
                lease_until=NULL,
                updated_at=CURRENT_TIMESTAMP
            WHERE id='backfill_official-se-trot-v2__2020-09-08__2023-09-07'
              AND (
                status='failed'
                OR (
                  status='running'
                  AND last_error='official race payload starts must be an array'
                )
              );

            SELECT status,next_date,next_race_index,consecutive_errors,
                   CASE WHEN last_error IS NULL THEN 'clear' ELSE 'present' END AS error_state
            FROM historical_backfill_jobs
            WHERE id='backfill_official-se-trot-v2__2020-09-08__2023-09-07';
          "

      - name: Verify the resumed checkpoint advances under the deployed fix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sleep 75
          npx --yes wrangler@4.114.0 d1 execute kentaurai --remote --command "
            SELECT status,next_date,next_race_index,consecutive_errors,
                   CASE WHEN last_error IS NULL THEN 'clear' ELSE 'present' END AS error_state
            FROM historical_backfill_jobs
            WHERE id='backfill_official-se-trot-v2__2020-09-08__2023-09-07';

            SELECT COUNT(*) AS structural_source_gaps
            FROM source_records
            WHERE source_type='official_provider'
              AND quality_status='captured_source_gap'
              AND json_extract(metadata_json,'$.sourceGap.code')='missing_starts_array';
          "
