name: Legacy AI and editorial data inventory (read-only)
run-name: Legacy data inventory — no deletion

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: kentaurai-production-operation
      cancel-in-progress: false
    steps:
      - name: Checkout exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Require main and a successful deployed ancestor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          release="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-release-v060.yml/runs?branch=main&status=success&per_page=1")"
          sha="$(printf '%s' "$release" | jq -r '.workflow_runs[0].head_sha // empty')"
          test -n "$sha"
          git cat-file -e "$sha^{commit}"
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Verify the entire test suite before private read-only access
        run: npm run qa

      - name: Count obsolete legacy data without returning private records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/inventory-legacy-data.mjs

      - name: Record non-deletion boundary
        if: ${{ always() }}
        run: |
          echo "Read-only aggregate D1 inventory. No data deletion, R2 traversal, deployment, migration, or Cloudflare secret changes." >> "$GITHUB_STEP_SUMMARY"
          echo "A separate verified private backup, FK/dependency review, and audited deletion plan are mandatory before any future delete." >> "$GITHUB_STEP_SUMMARY"
