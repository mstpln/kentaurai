name: Private historical source-provenance recovery
run-name: Historical provenance ${{ inputs.mode }} — continuation ${{ inputs.attempt }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inventory first, then backup-only approval, then separately approved execute"
        required: true
        type: choice
        options:
          - inventory
          - backup
          - execute
        default: inventory
      approval:
        description: "For backup: BACKUP_D1_ONLY; for execute: RESTORE_VERIFIED_SNAPSHOTS_ONLY"
        required: false
        type: string
      run_id:
        description: "Optional opaque continuation ID; leave blank for the active run"
        required: false
        type: string
      attempt:
        description: "Internal auto-resume count; leave at 0"
        required: false
        type: string
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  historical_recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    concurrency:
      group: kentaurai-production-operation
      cancel-in-progress: false
    env:
      WORKER_NAME: kentaurai-api
      RECOVERY_MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout exact deployed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require explicit approval for restore mode
        env:
          APPROVAL: ${{ inputs.approval }}
          ATTEMPT: ${{ inputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$RECOVERY_MODE" = execute ]; then
            test "$APPROVAL" = RESTORE_VERIFIED_SNAPSHOTS_ONLY
          elif [ "$RECOVERY_MODE" = backup ]; then
            test "$APPROVAL" = BACKUP_D1_ONLY
          else
            test "$RECOVERY_MODE" = inventory
          fi
          [[ "$ATTEMPT" =~ ^[0-9]+$ ]]
          (( ATTEMPT <= 160 ))

      - name: Require successful production release for exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          releases="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-release-v060.yml/runs?branch=main&status=success&per_page=1")"
          test "$(printf '%s' "$releases" | jq -r '.workflow_runs[0].head_sha // empty')" = "$GITHUB_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Full QA before touching Cloudflare
        run: npm run qa

      - name: Remove orphaned temporary recovery credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          names="$(npx --yes wrangler@4.114.0 secret list --name "$WORKER_NAME" --format json)"
          for name in HISTORICAL_REPAIR_ENABLED HISTORICAL_REPAIR_TOKEN HISTORICAL_REPAIR_EXPIRES_AT \
            HISTORICAL_BACKUP_API_TOKEN HISTORICAL_RECOVERY_ACCOUNT_ID STORAGE_CLEANUP_TOKEN; do
            if printf '%s' "$names" | jq -e --arg key "$name" \
              '.[] | select(.name == $key)' > /dev/null; then
              printf 'y\n' | npx --yes wrangler@4.114.0 secret delete "$name" --name "$WORKER_NAME"
            fi
          done

      - name: Install short-lived private status credential
        id: read_token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(node -e "console.log(Date.now()+'.'+require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$token" | npx --yes wrangler@4.114.0 secret put STORAGE_CLEANUP_TOKEN --name "$WORKER_NAME"

      - name: Verify exact deployed production Worker
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          subdomain="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/subdomain" | jq -r '.result.subdomain // empty')"
          test -n "$subdomain"
          enabled="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts/$WORKER_NAME/subdomain" | jq -r '.result.enabled // false')"
          test "$enabled" = true
          worker_url="https://$WORKER_NAME.$subdomain.workers.dev"
          curl --fail --silent --show-error "$worker_url/health" > "$RUNNER_TEMP/kentaurai-recovery-health.json"
          jq -e --arg sha "$GITHUB_SHA" \
            '.ok == true and .service == "kentaurai-api" and .deploymentSha == $sha' \
            "$RUNNER_TEMP/kentaurai-recovery-health.json" > /dev/null
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Wait for private status credential propagation
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
          CLEANUP_TOKEN: ${{ steps.read_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            status="$(curl --silent --output "$RUNNER_TEMP/kentaurai-recovery-auth.json" \
              --write-out '%{http_code}' -H "Authorization: Bearer $CLEANUP_TOKEN" \
              "$WORKER_URL/v1/storage-cleanup/auth-check" || true)"
            if [ "$status" = 200 ] && jq -e \
              '.ok == true and .scope == "storage_cleanup"' \
              "$RUNNER_TEMP/kentaurai-recovery-auth.json" > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::Private recovery auth propagation timed out"
          exit 1

      - name: Begin or resume private recovery run
        id: initialize
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
          CLEANUP_TOKEN: ${{ steps.read_token.outputs.token }}
          RECOVERY_RUN_ID: ${{ inputs.run_id }}
          RUNNER_PHASE: initialize
        run: node scripts/run-production-historical-recovery.mjs

      - name: Enable separate backup-only Cloudflare export (no data enters GitHub)
        if: ${{ inputs.mode == 'backup' && steps.initialize.outputs.phase == 'ready' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$CLOUDFLARE_API_TOKEN" \
            | npx --yes wrangler@4.114.0 secret put HISTORICAL_BACKUP_API_TOKEN --name "$WORKER_NAME"
          printf '%s\n' "$CLOUDFLARE_ACCOUNT_ID" \
            | npx --yes wrangler@4.114.0 secret put HISTORICAL_RECOVERY_ACCOUNT_ID --name "$WORKER_NAME"

      - name: Backup-only export from production D1 to private R2 (no restore)
        id: backup
        if: ${{ inputs.mode == 'backup' && steps.initialize.outputs.phase == 'ready' }}
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
          CLEANUP_TOKEN: ${{ steps.read_token.outputs.token }}
          RECOVERY_RUN_ID: ${{ steps.initialize.outputs.run_id }}
          RUNNER_PHASE: backup
        run: node scripts/run-production-historical-recovery.mjs

      - name: Enable short-lived RESTORE ONLY capability after separately verified backup
        id: write_token
        if: ${{ inputs.mode == 'execute' && steps.initialize.outputs.backup_verified == 'true' && steps.initialize.outputs.phase != 'complete' && steps.initialize.outputs.phase != 'complete_with_quarantine' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$token" | npx --yes wrangler@4.114.0 secret put HISTORICAL_REPAIR_TOKEN --name "$WORKER_NAME"
          printf 'true\n' | npx --yes wrangler@4.114.0 secret put HISTORICAL_REPAIR_ENABLED --name "$WORKER_NAME"
          expires_at="$(node -e "console.log(Math.floor(Date.now()/1000)+1200)")"
          printf '%s\n' "$expires_at" | npx --yes wrangler@4.114.0 secret put HISTORICAL_REPAIR_EXPIRES_AT --name "$WORKER_NAME"

      - name: Advance one cost-bounded recovery interval
        id: advance
        if: ${{ inputs.mode == 'inventory' || steps.write_token.outcome == 'success' }}
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
          CLEANUP_TOKEN: ${{ steps.read_token.outputs.token }}
          RECOVERY_RUN_ID: ${{ steps.initialize.outputs.run_id }}
          RUNNER_PHASE: run
          HISTORICAL_REPAIR_TOKEN: ${{ steps.write_token.outputs.token }}
        run: node scripts/run-production-historical-recovery.mjs

      - name: Remove every temporary Cloudflare credential
        if: ${{ always() && steps.read_token.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(npx --yes wrangler@4.114.0 secret list --name "$WORKER_NAME" --format json)"
          for name in HISTORICAL_REPAIR_ENABLED HISTORICAL_REPAIR_TOKEN HISTORICAL_REPAIR_EXPIRES_AT \
            HISTORICAL_BACKUP_API_TOKEN HISTORICAL_RECOVERY_ACCOUNT_ID STORAGE_CLEANUP_TOKEN; do
            if printf '%s' "$names" | jq -e --arg key "$name" \
              '.[] | select(.name == $key)' > /dev/null; then
              printf 'y\n' | npx --yes wrangler@4.114.0 secret delete "$name" --name "$WORKER_NAME"
            fi
          done

      - name: Verify production health after the operation
        if: ${{ always() && steps.worker.outcome == 'success' }}
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" > "$RUNNER_TEMP/kentaurai-recovery-health-after.json"
          jq -e --arg sha "$GITHUB_SHA" \
            '.ok == true and .service == "kentaurai-api" and .deploymentSha == $sha' \
            "$RUNNER_TEMP/kentaurai-recovery-health-after.json" > /dev/null

      - name: Automatically resume unfinished private work (bounded)
        if: ${{ success() && (steps.advance.outputs.continue == 'true' || steps.backup.outputs.continue == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt }}
          RUN_ID: ${{ steps.initialize.outputs.run_id }}
          APPROVAL: ${{ inputs.approval }}
        shell: bash
        run: |
          set -euo pipefail
          next=$((10#$ATTEMPT + 1))
          if (( next > 160 )); then
            echo "::error::Recovery continuation safety cap reached; manual investigation required."
            exit 1
          fi
          gh workflow run production-historical-recovery.yml --ref main \
            -f mode="$RECOVERY_MODE" -f run_id="$RUN_ID" \
            -f attempt="$next" -f approval="$APPROVAL"
          echo "An additional bounded recovery interval was queued." >> "$GITHUB_STEP_SUMMARY"

      - name: Document safety boundaries
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "Historical recovery: only verified source-owned INSERTs are permitted."
            echo "Private D1 exports stay inside Cloudflare and stream to private R2."
            echo "Backup and restoration require two separately approved workflow dispatches."
            echo "Every source is checked again against live original R2 facts and D1 provenance."
            echo "Unknown or contradictory histories remain quarantined; never delete or overwrite."
            echo "A queued continuation is NOT evidence that restoration is complete."
          } >> "$GITHUB_STEP_SUMMARY"
