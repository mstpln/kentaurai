name: Apply production D1 migrations
run-name: Apply production D1 migrations — @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      APPLY_PRODUCTION_MIGRATIONS:
        description: Confirm this run may apply pending migrations to the production kentaurai D1 database
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kentaurai-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.APPLY_PRODUCTION_MIGRATIONS == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate Cloudflare configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Run QA before production change
        run: npm run qa

      - name: Apply pending production D1 migrations
        run: npm run db:migrate:remote
