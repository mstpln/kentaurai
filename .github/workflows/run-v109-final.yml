name: Run final v109 QA

on:
  push:
    branches:
      - fix/official-nordic-identity-gaps-v109-final
    paths:
      - .github/workflows/run-v109-final.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed source edits
        run: |
          python3 scripts/apply-v110-hotfix.py
          python3 scripts/finalize-v109.py
      - name: Run repository QA
        run: npm run qa
      - name: Publish review head
        run: |
          rm -f .github/workflows/apply-v109-transfer.yml .github/workflows/diag-v109-entry-count.yml .github/workflows/finalize-v109-bjerke.yml .github/workflows/finalize-v109-bjerke-2.yml .github/workflows/finalize-v109-bjerke-3.yml .github/workflows/run-v109-final.yml
          rm -f .tmp/v109.patch.gz.b64 scripts/apply-v110-hotfix.py scripts/finalize-v109.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Nordic official participant identity gaps"
          git push origin HEAD:fix/official-nordic-identity-gaps-v109-final
