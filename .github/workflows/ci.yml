name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Changed test - analysis workflow
        run: node --test test/analysis-workflow-v2.test.js

      - name: Changed test - strict boundary
        run: node --test test/analysis-workflow-v2-strict.test.js

      - name: Changed test - horse patterns
        run: node --test test/horse-patterns-batch.test.js

      - name: Changed test - v064
        run: node --test test/v064.test.js

      - name: Run QA
        run: npm run qa
