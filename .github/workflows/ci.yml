name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Full test suite
        run: npm test

      - name: Syntax - index
        run: node --check src/index.js

      - name: Syntax - worker settings
        run: node --check src/worker-settings.js

      - name: Syntax - settings data
        run: node --check src/settings-data.js

      - name: Syntax - app page settings
        run: node --check src/app-page-settings.js
