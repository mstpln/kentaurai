name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Aligned tests
        run: node --test test/aligned*.test.js

      - name: Analysis tests
        run: node --test test/analysis*.test.js

      - name: Tests b-d
        run: |
          shopt -s nullglob
          files=(test/[b-d]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi

      - name: Tests e-g
        run: |
          shopt -s nullglob
          files=(test/[e-g]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi

      - name: Tests h-m
        run: |
          shopt -s nullglob
          files=(test/[h-m]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi

      - name: Tests n-s
        run: |
          shopt -s nullglob
          files=(test/[n-s]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi

      - name: Tests t-z
        run: |
          shopt -s nullglob
          files=(test/[t-z]*.test.js)
          if ((${#files[@]})); then node --test "${files[@]}"; fi

      - name: Syntax - index
        run: node --check src/index.js

      - name: Syntax - worker settings
        run: node --check src/worker-settings.js

      - name: Syntax - settings data
        run: node --check src/settings-data.js

      - name: Syntax - app page settings
        run: node --check src/app-page-settings.js
