name: Inspect stalled private multipart backup (read-only)
run-name: Manual inspection of private backup progress — no export

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type INSPECT_MULTIPART_ONLY. No new D1 export, R2 upload or deletion."
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  inspect_only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    concurrency:
      group: kentaurai-production-operation
      cancel-in-progress: false
    env:
      WORKER_NAME: kentaurai-api
    steps:
      - name: Checkout exact reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require typed inspection-only approval and matching deployed version
        env:
          APPROVAL: ${{ inputs.approval }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$APPROVAL" = INSPECT_MULTIPART_ONLY
          releases="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-release-v060.yml/runs?branch=main&status=success&per_page=1")"
          test "$(printf '%s' "$releases" | jq -r '.workflow_runs[0].head_sha // empty')" = "$GITHUB_SHA"

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Full QA before any private diagnostic capability
        run: npm run qa

      - name: Install temporary inspection-only credential (never a backup credential)
        id: diag_credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          token="$(node -e "console.log(Date.now()+'.'+require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$token"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$token" | npx --yes wrangler@4.114.0 secret put LEGACY_MULTIPART_DIAG_TOKEN --name "$WORKER_NAME"
          printf 'true\n' | npx --yes wrangler@4.114.0 secret put LEGACY_MULTIPART_DIAG_ENABLED --name "$WORKER_NAME"

      - name: Verify exact production Worker and distinct read-only diagnostic access
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DIAG_TOKEN: ${{ steps.diag_credential.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          subdomain="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/subdomain" | jq -r '.result.subdomain // empty')"
          test -n "$subdomain"
          enabled="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts/$WORKER_NAME/subdomain" | jq -r '.result.enabled // false')"
          test "$enabled" = true
          url="https://$WORKER_NAME.$subdomain.workers.dev"
          curl --fail --silent --show-error "$url/health" > "$RUNNER_TEMP/multipart-diag-health.json"
          jq -e --arg sha "$GITHUB_SHA" '.ok==true and .deploymentSha==$sha' \
            "$RUNNER_TEMP/multipart-diag-health.json" > /dev/null
          confirmed=0
          for attempt in $(seq 1 25); do
            code="$(curl --silent --output "$RUNNER_TEMP/multipart-diag-auth.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $DIAG_TOKEN" \
              "$url/v1/storage-cleanup/legacy-backup-diagnostic/auth-check" || true)"
            if [ "$code" = 200 ] && jq -e \
              '.ok==true and .scope=="legacy_multipart_diagnostic_only"' \
              "$RUNNER_TEMP/multipart-diag-auth.json" >/dev/null 2>&1; then
              confirmed=$((confirmed+1))
              if [ "$confirmed" -ge 2 ]; then
                echo "worker_url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              confirmed=0
            fi
            sleep 2
          done
          echo "::error::Read-only diagnostic authorization failed. No export attempted."
          exit 1

      - name: Read sanitized private R2 backup status (GET ONLY)
        env:
          DIAG_TOKEN: ${{ steps.diag_credential.outputs.token }}
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $DIAG_TOKEN" \
            "$WORKER_URL/v1/storage-cleanup/legacy-backup-diagnostic/inspect" \
            > "$RUNNER_TEMP/private-multipart-inspection.json"
          jq -e '
            .mode=="private_multipart_status_only" and
            (.status|IN("none","starting","exporting","initializing","uploading","stored","complete")) and
            .d1Queried==false and .r2Modified==false and
            .backupExportStartedByThisCheck==false and
            .dataDeleted==false and .rawPayloadReturned==false
          ' "$RUNNER_TEMP/private-multipart-inspection.json" > /dev/null
          jq -c '{status,controlExists,deploymentMatches,bookmarkSaved,exportStartUncertain,partsUploaded,completeReceiptClaimed}' \
            "$RUNNER_TEMP/private-multipart-inspection.json"
          {
            echo "## Read-only backup incident inspection"
            echo ""
            echo "The private R2 progress marker was inspected; no D1 API request, export, R2 PUT, or database query was performed."
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            jq -r '"| Private progress status | \(.status) |", "| Progress marker found | \(.controlExists) |", "| Same deployed build | \(.deploymentMatches) |", "| Export bookmark persisted | \(.bookmarkSaved) |", "| Export start outcome uncertain | \(.exportStartUncertain) |", "| Uploaded parts claimed | \(.partsUploaded) |"' \
              "$RUNNER_TEMP/private-multipart-inspection.json"
            echo ""
            echo "No backup completion, restore verification or deletion is inferred from this inspection."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary diagnostic secrets even when inspection fails
        if: ${{ always() && steps.diag_credential.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(npx --yes wrangler@4.114.0 secret list --name "$WORKER_NAME" --format json)"
          for name in LEGACY_MULTIPART_DIAG_ENABLED LEGACY_MULTIPART_DIAG_TOKEN; do
            if printf '%s' "$names" | jq -e --arg name "$name" \
              '.[] | select(.name==$name)' > /dev/null; then
              printf 'y\n' | npx --yes wrangler@4.114.0 secret delete "$name" --name "$WORKER_NAME"
            fi
          done

      - name: Verify health after temporary secret removal
        if: ${{ always() && steps.worker.outcome == 'success' }}
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" > "$RUNNER_TEMP/multipart-diag-health-after.json"
          jq -e --arg sha "$GITHUB_SHA" '.ok==true and .deploymentSha==$sha' \
            "$RUNNER_TEMP/multipart-diag-health-after.json" >/dev/null

      - name: Record no-export boundary
        if: ${{ always() }}
        run: |
          echo "Inspection only. No export start, database lock, R2 multipart upload, restore or deletion." >> "$GITHUB_STEP_SUMMARY"
