name: Verify production reference import

on:
  push:
    branches: [ops/verify-reference-import-v063]
    paths: [.github/workflows/verify-production-reference-import.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify private reference import structure
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          sql=$(cat <<'SQL'
          WITH target AS (
            SELECT id,game_round_id,source_record_id,export_version,captured_at,race_count,entry_count FROM reference_round_exports ORDER BY created_at DESC LIMIT 1
          ), analyses AS (
            SELECT a.id FROM target t JOIN game_legs gl ON gl.game_round_id=t.game_round_id JOIN ai_race_analyses a ON a.race_id=gl.race_id AND a.data_snapshot_at=t.captured_at
          ), systems_for_round AS (
            SELECT s.id,s.spike_count FROM target t JOIN systems s ON s.game_round_id=t.game_round_id
          )
          SELECT
            (SELECT COUNT(*) FROM target)=1 export_present,
            (SELECT COUNT(*) FROM target t JOIN source_records sr ON sr.id=t.source_record_id WHERE sr.raw_object_key IS NOT NULL AND sr.content_hash IS NOT NULL)=1 archive_present,
            (SELECT COUNT(*) FROM target t JOIN game_rounds gr ON gr.id=t.game_round_id)=1 round_present,
            ((SELECT COUNT(*) FROM target t JOIN game_legs gl ON gl.game_round_id=t.game_round_id)=8 AND (SELECT race_count FROM target)=8) legs_ok,
            ((SELECT COUNT(*) FROM target t JOIN game_legs gl ON gl.game_round_id=t.game_round_id JOIN race_entries re ON re.race_id=gl.race_id)=(SELECT entry_count FROM target) AND (SELECT entry_count FROM target)>0) entries_ok,
            (SELECT COUNT(*) FROM analyses)=8 analyses_ok,
            (SELECT COUNT(*) FROM analyses a JOIN ai_horse_predictions p ON p.ai_race_analysis_id=a.id)=(SELECT entry_count FROM target) predictions_ok,
            (SELECT COUNT(*) FROM analyses a WHERE ABS((SELECT COALESCE(SUM(COALESCE(p.win_probability,0)),0) FROM ai_horse_predictions p WHERE p.ai_race_analysis_id=a.id)-1.0)>0.00001)=0 probability_sums_ok,
            ((SELECT COUNT(*) FROM systems_for_round)>0 AND (SELECT COUNT(*) FROM systems_for_round WHERE spike_count<>3)=0) systems_ok,
            (SELECT COUNT(*) FROM systems_for_round s WHERE (SELECT COUNT(*) FROM system_selections ss WHERE ss.system_id=s.id AND ss.is_spike=1)<>3)=0 selections_ok,
            (SELECT COUNT(*) FROM target WHERE export_version='kentaurai-reference-v1')=1 contract_ok;
          SQL
          )
          code="$(curl -sS -o "$response_file" -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" "$api")"
          [[ "$code" == 200 ]] || { echo 'verification_query_failed'; exit 1; }
          jq -e '.success==true and .result[0].success==true and (.result[0].results|length==1)' "$response_file" >/dev/null || { echo 'verification_response_invalid'; exit 1; }
          failed="$(jq -r '.result[0].results[0] | to_entries[] | select(.value != 1) | .key' "$response_file")"
          if [[ -n "$failed" ]]; then
            echo 'Failed invariant names (no private values):'
            printf '%s\n' "$failed"
            exit 1
          fi
          echo 'Production reference import verification passed.'
