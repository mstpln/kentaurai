name: One-off legacy cleanup preflight (read-only)
run-name: Read-only legacy D1 size, candidate counts and saved-system links

on:
  push:
    branches:
      - ops/legacy-safe-inventory-20261108
    paths:
      - .github/workflows/one-off-legacy-safe-inventory.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect_only:
    if: github.repository == 'mstpln/kentaurai' && github.ref == 'refs/heads/ops/legacy-safe-inventory-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: kentaurai-production-operation
      cancel-in-progress: false
    steps:
      - name: Checkout exact deployed audited main (not branch scripts)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 1d10401721a1b3df84bcd474976b253cd523be3e
          persist-credentials: false
          fetch-depth: 1

      - name: Require main still equal to the successfully deployed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          main="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/git/ref/heads/main" \
            | jq -r '.object.sha // empty')"
          test "$main" = "1d10401721a1b3df84bcd474976b253cd523be3e"
          release="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/actions/workflows/production-release-v060.yml/runs?branch=main&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha // empty')"
          test "$release" = "$main"
          echo "Reviewed deployed main is unchanged. Querying only aggregates and Cloudflare metadata."

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Verify repository QA before any private read-only API access
        run: npm run qa

      - name: Read current production D1 size (GET-only API metadata)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-legacy-backup-capacity.mjs

      - name: Count legacy candidate and protected tables (read-only aggregates)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: node scripts/inventory-legacy-data.mjs

      - name: Measure candidate-to-system links and integrity (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
        run: node scripts/preview-legacy-cleanup.mjs

      - name: Record one-time safety boundary
        if: ${{ always() }}
        run: |
          echo "One-off preflight only. No data deletion, D1 export, R2 access, Worker deployment or migration." >> "$GITHUB_STEP_SUMMARY"
          echo "The branch workflow checked out *reviewed deployed main* for all executable scripts." >> "$GITHUB_STEP_SUMMARY"
          echo "No backup or deletion is authorized by this report." >> "$GITHUB_STEP_SUMMARY"
