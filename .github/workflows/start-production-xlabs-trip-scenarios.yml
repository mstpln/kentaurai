name: Start production X-Labs trip scenarios
run-name: Start production X-Labs trip scenarios — @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type START XLABS TRIP SCENARIOS to authorize the production job
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kentaurai-production-xlabs-trip-scenarios
  cancel-in-progress: false

jobs:
  start:
    if: ${{ inputs.confirmation == 'START XLABS TRIP SCENARIOS' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Run QA before production change
        run: npm run qa

      - name: Start bounded production reconstruction job
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: d8189e0e-6127-4ef2-88cc-534cb2217340
          JOB_ID: xposjob_xlabs-trip-classification-v1__existing
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          d1_query() {
            local sql="$1"
            local code
            code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}'               --request POST               --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               --header 'Content-Type: application/json'               --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"               "$api")"
            [[ "$code" == "200" ]] || { echo "Cloudflare D1 query failed (HTTP $code)"; exit 1; }
            jq -e '.success == true and (.result | length >= 1) and (.result | all(.success == true))' "$response_file" > /dev/null || {
              echo "Cloudflare D1 query returned an unsuccessful result"
              exit 1
            }
          }

          d1_query "SELECT MIN(SUBSTR(external_id,1,10)) AS start_date, MAX(SUBSTR(external_id,1,10)) AS end_date, COUNT(*) AS sources FROM source_records WHERE source_type='xlabs_race_json' AND raw_object_key IS NOT NULL;"
          start_date="$(jq -r '.result[0].results[0].start_date // empty' "$response_file")"
          end_date="$(jq -r '.result[0].results[0].end_date // empty' "$response_file")"
          sources="$(jq -r '.result[0].results[0].sources // 0' "$response_file")"
          [[ "$start_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "No valid X-Labs start date found"; exit 1; }
          [[ "$end_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "No valid X-Labs end date found"; exit 1; }
          [[ "$sources" -gt 0 ]] || { echo "No stored X-Labs race sources found"; exit 1; }

          d1_query "SELECT COUNT(*) AS other_running FROM xlabs_position_reconstruction_jobs WHERE status='running' AND id <> '$JOB_ID';"
          other_running="$(jq -r '.result[0].results[0].other_running' "$response_file")"
          [[ "$other_running" == "0" ]] || { echo "Another position reconstruction job is already running"; exit 1; }

          d1_query "INSERT OR IGNORE INTO xlabs_position_reconstruction_jobs (id,start_date,end_date,status,reconstruction_version) VALUES ('$JOB_ID','$start_date','$end_date','running','xlabs-position-reconstruction-v1');"
          d1_query "UPDATE xlabs_position_reconstruction_jobs SET status=CASE WHEN status='failed' THEN 'running' ELSE status END, consecutive_errors=0, last_error=NULL, updated_at=CURRENT_TIMESTAMP WHERE id='$JOB_ID';"

          d1_query "SELECT id,start_date,end_date,status,processed_sources,inserted_rows,skipped_rows FROM xlabs_position_reconstruction_jobs WHERE id='$JOB_ID' LIMIT 1;"
          jq -e --arg id "$JOB_ID" '.result[0].results | length == 1 and .[0].id == $id and (.[0].status == "running" or .[0].status == "completed")' "$response_file" > /dev/null || {
            echo "Trip scenario reconstruction job did not reach expected state"
            exit 1
          }
          echo "Trip scenario reconstruction job ready for $sources stored X-Labs source records."
