name: Diagnose Step 1 Track Analysis CPU

on:
  push:
    branches:
      - fix/step1-track-analysis-d1-cpu
    paths:
      - '.github/diagnose-step1-track-analysis.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Aggregate table sizes only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 d1 execute kentaurai --remote --command "
            SELECT 'race_positions' metric, COUNT(*) value FROM race_positions;
            SELECT 'race_position_checkpoints' metric, COUNT(*) value FROM race_position_checkpoints;
          " > /tmp/track-analysis-counts.txt
          cat /tmp/track-analysis-counts.txt

      - name: Probe current-round baseline position query
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          npx --yes wrangler@4.114.0 d1 execute kentaurai --remote --command "
            WITH target AS (
              SELECT r.track_id,t.country_code,
                CASE
                  WHEN lower(coalesce(r.start_method,'')) IN ('auto','autostart') THEN 'auto'
                  WHEN lower(coalesce(r.start_method,'')) IN ('volt','volte','voltstart') THEN 'volt'
                  ELSE 'unknown'
                END AS method_key,
                r.distance_m
              FROM game_rounds gr
              JOIN game_legs gl ON gl.game_round_id=gr.id
              JOIN races r ON r.id=gl.race_id
              JOIN tracks t ON t.id=r.track_id
              WHERE gr.game_type IN ('V85','V86')
                AND gr.round_date >= date('now','-1 day')
              ORDER BY gr.round_date ASC,gl.leg_number ASC
              LIMIT 1
            ),
            eligible_entries AS MATERIALIZED (
              SELECT re.id AS race_entry_id,r.id AS race_id
              FROM target x
              JOIN tracks t ON t.country_code=x.country_code
              JOIN races r ON r.track_id=t.id
              JOIN race_entries re INDEXED BY idx_entries_race ON re.race_id=r.id
              JOIN race_results rr ON rr.race_entry_id=re.id
              LEFT JOIN source_records rrs ON rrs.id=rr.source_record_id
              WHERE r.track_id<>x.track_id
                AND re.scratched=0
                AND re.actual_lane BETWEEN 1 AND 8
                AND rr.result_status='official'
                AND CASE
                  WHEN lower(coalesce(r.start_method,'')) IN ('auto','autostart') THEN 'auto'
                  WHEN lower(coalesce(r.start_method,'')) IN ('volt','volte','voltstart') THEN 'volt'
                  ELSE 'unknown'
                END=x.method_key
                AND r.distance_m BETWEEN x.distance_m-100 AND x.distance_m+100
                AND r.race_date < date('now')
                AND rr.source_record_id IS NOT NULL
                AND julianday(rrs.fetched_at)<=julianday('now')
            ),
            ranked AS (
              SELECT rpc.id,rpc.race_entry_id,rpc.checkpoint_key,
                ROW_NUMBER() OVER (
                  PARTITION BY rpc.race_entry_id,rpc.checkpoint_key
                  ORDER BY julianday(sr.fetched_at) DESC,rpc.id DESC
                ) row_number
              FROM eligible_entries e
              JOIN race_position_checkpoints rpc INDEXED BY idx_position_checkpoints_entry_source
                ON rpc.race_entry_id=e.race_entry_id
              JOIN source_records sr ON sr.id=rpc.source_record_id
              WHERE rpc.reconstruction_version='xlabs-position-reconstruction-v1'
                AND rpc.checkpoint_key IN ('100m','200m')
                AND rpc.position_rank IS NOT NULL
                AND rpc.field_coverage>=0.999
                AND rpc.longitudinal_confidence>=0.65
                AND julianday(sr.fetched_at)<=julianday('now')
            )
            SELECT COUNT(*) observations FROM ranked WHERE row_number=1;
          " > /tmp/position-probe.txt
          echo "baseline_position_seconds=$(( $(date +%s) - start ))"

      - name: Probe current-round baseline scenario query
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          npx --yes wrangler@4.114.0 d1 execute kentaurai --remote --command "
            WITH target AS (
              SELECT r.track_id,t.country_code,
                CASE
                  WHEN lower(coalesce(r.start_method,'')) IN ('auto','autostart') THEN 'auto'
                  WHEN lower(coalesce(r.start_method,'')) IN ('volt','volte','voltstart') THEN 'volt'
                  ELSE 'unknown'
                END AS method_key,
                r.distance_m
              FROM game_rounds gr
              JOIN game_legs gl ON gl.game_round_id=gr.id
              JOIN races r ON r.id=gl.race_id
              JOIN tracks t ON t.id=r.track_id
              WHERE gr.game_type IN ('V85','V86')
                AND gr.round_date >= date('now','-1 day')
              ORDER BY gr.round_date ASC,gl.leg_number ASC
              LIMIT 1
            ),
            eligible_entries AS MATERIALIZED (
              SELECT re.id AS race_entry_id,r.id AS race_id
              FROM target x
              JOIN tracks t ON t.country_code=x.country_code
              JOIN races r ON r.track_id=t.id
              JOIN race_entries re INDEXED BY idx_entries_race ON re.race_id=r.id
              JOIN race_results rr ON rr.race_entry_id=re.id
              LEFT JOIN source_records rrs ON rrs.id=rr.source_record_id
              WHERE r.track_id<>x.track_id
                AND re.scratched=0
                AND rr.result_status='official'
                AND CASE
                  WHEN lower(coalesce(r.start_method,'')) IN ('auto','autostart') THEN 'auto'
                  WHEN lower(coalesce(r.start_method,'')) IN ('volt','volte','voltstart') THEN 'volt'
                  ELSE 'unknown'
                END=x.method_key
                AND r.distance_m BETWEEN x.distance_m-100 AND x.distance_m+100
                AND r.race_date < date('now')
                AND rr.source_record_id IS NOT NULL
                AND julianday(rrs.fetched_at)<=julianday('now')
            ),
            ranked AS (
              SELECT rp.id,rp.race_entry_id,
                ROW_NUMBER() OVER (
                  PARTITION BY rp.race_entry_id
                  ORDER BY julianday(sr.fetched_at) DESC,rp.id DESC
                ) row_number
              FROM eligible_entries e
              JOIN race_positions rp INDEXED BY idx_positions_entry ON rp.race_entry_id=e.race_entry_id
              JOIN source_records sr ON sr.id=rp.source_record_id
              WHERE rp.classification_version='xlabs-trip-classification-v1'
                AND julianday(sr.fetched_at)<=julianday('now')
            )
            SELECT COUNT(*) observations FROM ranked WHERE row_number=1;
          " > /tmp/scenario-probe.txt
          echo "baseline_scenario_seconds=$(( $(date +%s) - start ))"

      - name: Probe current-round baseline 500m query
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          npx --yes wrangler@4.114.0 d1 execute kentaurai --remote --command "
            WITH target AS (
              SELECT r.track_id,t.country_code,
                CASE
                  WHEN lower(coalesce(r.start_method,'')) IN ('auto','autostart') THEN 'auto'
                  WHEN lower(coalesce(r.start_method,'')) IN ('volt','volte','voltstart') THEN 'volt'
                  ELSE 'unknown'
                END AS method_key,
                r.distance_m
              FROM game_rounds gr
              JOIN game_legs gl ON gl.game_round_id=gr.id
              JOIN races r ON r.id=gl.race_id
              JOIN tracks t ON t.id=r.track_id
              WHERE gr.game_type IN ('V85','V86')
                AND gr.round_date >= date('now','-1 day')
              ORDER BY gr.round_date ASC,gl.leg_number ASC
              LIMIT 1
            ),
            eligible_entries AS MATERIALIZED (
              SELECT re.id AS race_entry_id,r.id AS race_id
              FROM target x
              JOIN tracks t ON t.country_code=x.country_code
              JOIN races r ON r.track_id=t.id
              JOIN race_entries re INDEXED BY idx_entries_race ON re.race_id=r.id
              JOIN race_results rr ON rr.race_entry_id=re.id
              LEFT JOIN source_records rrs ON rrs.id=rr.source_record_id
              WHERE r.track_id<>x.track_id
                AND re.scratched=0
                AND rr.result_status='official'
                AND CASE
                  WHEN lower(coalesce(r.start_method,'')) IN ('auto','autostart') THEN 'auto'
                  WHEN lower(coalesce(r.start_method,'')) IN ('volt','volte','voltstart') THEN 'volt'
                  ELSE 'unknown'
                END=x.method_key
                AND r.distance_m BETWEEN x.distance_m-100 AND x.distance_m+100
                AND r.race_date < date('now')
                AND rr.source_record_id IS NOT NULL
                AND julianday(rrs.fetched_at)<=julianday('now')
            ),
            ranked AS (
              SELECT rpc.id,rpc.race_entry_id,
                ROW_NUMBER() OVER (
                  PARTITION BY rpc.race_entry_id,rpc.checkpoint_key
                  ORDER BY julianday(sr.fetched_at) DESC,rpc.id DESC
                ) row_number
              FROM eligible_entries e
              JOIN race_position_checkpoints rpc INDEXED BY idx_position_checkpoints_entry_source
                ON rpc.race_entry_id=e.race_entry_id
              JOIN source_records sr ON sr.id=rpc.source_record_id
              WHERE rpc.reconstruction_version='xlabs-position-reconstruction-v1'
                AND rpc.checkpoint_key='500m'
                AND rpc.position_rank IS NOT NULL
                AND rpc.field_coverage>=0.999
                AND rpc.longitudinal_confidence>=0.65
                AND julianday(sr.fetched_at)<=julianday('now')
            )
            SELECT COUNT(*) observations FROM ranked WHERE row_number=1;
          " > /tmp/early500-probe.txt
          echo "baseline_500m_seconds=$(( $(date +%s) - start ))"
