name: Inspect D1 metadata from Worker (GET only)
run-name: Private Worker D1 metadata diagnostic - no export

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type INSPECT_D1_METADATA_ONLY. This is a read-only metadata GET, not an export."
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  inspect_metadata_only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    concurrency:
      group: kentaurai-production-operation
      cancel-in-progress: false
    env:
      WORKER_NAME: kentaurai-api
    steps:
      - name: Checkout exact reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require typed GET-only approval and exact deployed release
        env:
          APPROVAL: ${{ inputs.approval }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$APPROVAL" = INSPECT_D1_METADATA_ONLY
          releases="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-release-v060.yml/runs?branch=main&status=success&per_page=1")"
          test "$(printf '%s' "$releases" | jq -r '.workflow_runs[0].head_sha // empty')" = "$GITHUB_SHA"

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Full QA before private diagnostics
        run: npm run qa

      - name: Install isolated temporary diagnostic and D1 GET credentials
        id: diag_credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          token="$(node -e "console.log(Date.now()+'.'+require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$token"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler@4.114.0 secret put HISTORICAL_BACKUP_API_TOKEN --name "$WORKER_NAME"
          printf '%s\n' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4.114.0 secret put HISTORICAL_RECOVERY_ACCOUNT_ID --name "$WORKER_NAME"
          printf '%s\n' "$token" | npx --yes wrangler@4.114.0 secret put LEGACY_MULTIPART_DIAG_TOKEN --name "$WORKER_NAME"
          printf 'true\n' | npx --yes wrangler@4.114.0 secret put LEGACY_MULTIPART_DIAG_ENABLED --name "$WORKER_NAME"

      - name: Verify exact production Worker and diagnostic-only authorization
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DIAG_TOKEN: ${{ steps.diag_credential.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          subdomain="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/subdomain" | jq -r '.result.subdomain // empty')"
          test -n "$subdomain"
          enabled="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts/$WORKER_NAME/subdomain" | jq -r '.result.enabled // false')"
          test "$enabled" = true
          url="https://$WORKER_NAME.$subdomain.workers.dev"
          curl --fail --silent --show-error "$url/health" > "$RUNNER_TEMP/metadata-health.json"
          jq -e --arg sha "$GITHUB_SHA" '.ok==true and .deploymentSha==$sha' \
            "$RUNNER_TEMP/metadata-health.json" > /dev/null
          confirmed=0
          for attempt in $(seq 1 25); do
            code="$(curl --silent --output "$RUNNER_TEMP/metadata-auth.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $DIAG_TOKEN" \
              "$url/v1/storage-cleanup/legacy-backup-diagnostic/auth-check" || true)"
            if [ "$code" = 200 ] && jq -e \
              '.ok==true and .scope=="legacy_multipart_diagnostic_only"' \
              "$RUNNER_TEMP/metadata-auth.json" >/dev/null 2>&1; then
              confirmed=$((confirmed+1))
              if [ "$confirmed" -ge 2 ]; then
                echo "worker_url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              confirmed=0
            fi
            sleep 2
          done
          echo "::error::Read-only diagnostic authorization unavailable; no metadata request sent."
          exit 1

      - name: Inspect Worker-side D1 metadata only (no export, no D1 SQL)
        env:
          DIAG_TOKEN: ${{ steps.diag_credential.outputs.token }}
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Read-only Worker-side D1 metadata diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No D1 SQL query, export, R2 write, backup, restore or deletion was attempted." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Probe | Verified | Safe reason |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for attempt in 1 2 3; do
            # A 401 means the Worker rejected authorization before dispatch.
            # Secret changes can propagate across isolates at different times;
            # only this read-only GET may be retried, with the same token.
            for auth_try in $(seq 1 12); do
              if ! code="$(curl --silent --max-time 25 \
                --output "$RUNNER_TEMP/private-d1-metadata.json" \
                --write-out '%{http_code}' \
                -H "Authorization: Bearer $DIAG_TOKEN" \
                "$WORKER_URL/v1/storage-cleanup/legacy-backup-diagnostic/metadata")"; then
                echo "::error::Read-only metadata transport failed; no retry or export."
                exit 1
              fi
              if [ "$code" = 200 ]; then break; fi
              if [ "$code" != 401 ]; then
                echo "::error::Read-only metadata request returned a non-retriable status."
                exit 1
              fi
              if [ "$auth_try" -eq 12 ]; then
                echo "::error::Read-only metadata authorization remained unavailable."
                exit 1
              fi
              sleep 3
            done
            jq -e '
              .mode=="private_multipart_metadata_only" and
              (.status|IN("verified","failed")) and
              (.reason|IN("none","credentials_unavailable","transport_unavailable",
                "cloudflare_http_400","cloudflare_http_401","cloudflare_http_403",
                "cloudflare_http_404","cloudflare_http_409","cloudflare_http_423",
                "cloudflare_http_429","cloudflare_http_500","cloudflare_http_502",
                "cloudflare_http_503","cloudflare_http_504","cloudflare_http_other",
                "cloudflare_response_unverified","cloudflare_json_invalid",
                "source_size_out_of_bounds","private_bindings_unavailable",
                "internal_operation_failed")) and
              .d1Queried==false and .exportStarted==false and
              .r2Modified==false and .dataDeleted==false and
              .rawPayloadReturned==false and
              ((.status=="verified" and .reason=="none") or .status=="failed")
            ' "$RUNNER_TEMP/private-d1-metadata.json" > /dev/null
            jq -c '{status,reason}' "$RUNNER_TEMP/private-d1-metadata.json"
            jq -r --arg n "$attempt" '"| \($n) | \(.status) | \(.reason) |"' \
              "$RUNNER_TEMP/private-d1-metadata.json" >> "$GITHUB_STEP_SUMMARY"
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A verified metadata GET is not approval to start D1 export; a failed GET is not retried as an export." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove all temporary diagnostic and metadata credentials
        if: ${{ always() && steps.diag_credential.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(npx --yes wrangler@4.114.0 secret list --name "$WORKER_NAME" --format json)"
          for name in LEGACY_MULTIPART_DIAG_ENABLED LEGACY_MULTIPART_DIAG_TOKEN \
            HISTORICAL_BACKUP_API_TOKEN HISTORICAL_RECOVERY_ACCOUNT_ID; do
            if printf '%s' "$names" | jq -e --arg name "$name" \
              '.[] | select(.name==$name)' > /dev/null; then
              printf 'y\n' | npx --yes wrangler@4.114.0 secret delete "$name" --name "$WORKER_NAME"
            fi
          done

      - name: Verify health after temporary credentials are removed
        if: ${{ always() && steps.worker.outcome == 'success' }}
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" > "$RUNNER_TEMP/metadata-health-after.json"
          jq -e --arg sha "$GITHUB_SHA" '.ok==true and .deploymentSha==$sha' \
            "$RUNNER_TEMP/metadata-health-after.json" > /dev/null

      - name: Confirm read-only boundary
        if: ${{ always() }}
        run: |
          echo "Metadata GET only. No backup/export, D1 SQL, R2 write, restore or deletion." >> "$GITHUB_STEP_SUMMARY"
